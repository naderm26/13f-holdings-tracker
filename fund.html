
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>13F Holdings Tracker</title>
  <meta name="description" content=""/>
  <meta property="og:title" content=""/>
  <meta property="og:description" content=""/>
  <meta property="og:type" content="website"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f7f6f3; --surface: #ffffff; --border: #e8e6e1;
      --text: #1a1917; --muted: #8a8780; --accent: #2d5a3d;
      --accent-light: #eef4f0; --green: #2d6a3f; --red: #b91c1c;
      --mono: 'DM Mono', monospace; --sans: 'DM Sans', sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 2rem 3rem; display: flex; align-items: flex-end;
      justify-content: space-between; flex-wrap: wrap; gap: 1rem;
    }
    .header-left h1 { font-size: 1.1rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
    .back-link { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); text-decoration: none; display: block; margin-bottom: 0.4rem; }
    .back-link:hover { color: var(--text); }
    .header-right { display: flex; gap: 2.5rem; }
    .stat { text-align: right; }
    .stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 500; }
    .stat-value { font-family: var(--mono); font-size: 1.4rem; font-weight: 500; color: var(--text); margin-top: 0.15rem; }
    .stat-value.green { color: var(--accent); }
    main { padding: 2.5rem 3rem; max-width: 1200px; margin: 0 auto; }
    .section-label { font-size: 1.4rem; letter-spacing: 0.02em; color: var(--text); font-weight: 500; margin-bottom: 0.4rem; }
    .period-line { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); margin-bottom: 0.75rem; }
    .quarter-selector { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .q-btn {
      font-family: var(--mono); font-size: 0.72rem; padding: 0.35rem 0.75rem;
      border: 1px solid var(--border); border-radius: 4px; background: var(--surface);
      color: var(--muted); cursor: pointer; transition: all 0.15s;
    }
    .q-btn:hover { border-color: var(--accent); color: var(--accent); }
    .q-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    thead tr { background: var(--bg); border-bottom: 1px solid var(--border); }
    th { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; color: var(--muted); padding: 0.75rem 0.6rem; text-align: center; cursor: pointer; user-select: none; white-space: normal; line-height: 1.4; }
    th:nth-child(1) { text-align: left; width: 30px; }
    th:nth-child(2) { text-align: left; width: 22%; }
    th:nth-child(n+3) { width: 8.8%; text-align: center; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow-x: auto; display: block; table-layout: fixed; }
    th:hover { color: var(--text); }
    td { padding: 0.85rem 0.6rem; font-size: 0.875rem; border-bottom: 1px solid var(--border); vertical-align: middle; white-space: nowrap; text-align: center; }
    td:nth-child(1) { text-align: left; }
    td:nth-child(2) { text-align: left; white-space: normal; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--accent-light); }
    .company-name { font-weight: 500; color: var(--text); white-space: normal; }
    .cusip { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); margin-top: 0.15rem; }
    td.num { font-family: var(--mono); font-size: 0.82rem; padding: 0.85rem 0.6rem; text-align: center; }
    .chg { font-family: var(--mono); font-size: 0.82rem; font-weight: 500; }
    .chg.pos { color: var(--green); }
    .chg.neg { color: var(--red); }
    .chg.new { color: var(--green); font-size: 0.72rem; letter-spacing: 0.05em; }
    .chg.exited { color: var(--red); font-size: 0.72rem; letter-spacing: 0.05em; }
    .chg.na { color: var(--muted); }
    .putcall { font-family: var(--mono); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em; }
    .putcall.put  { color: var(--red); }
    .putcall.call { color: var(--green); }
    tr.exited td { color: var(--muted); background: #f0ede8; }
    .stale-warning {
      background: #fef9e7; border: 1px solid #f0c040; border-radius: 6px;
      padding: 0.75rem 1.25rem; margin-bottom: 1.5rem;
      font-size: 0.82rem; color: #7d5a00; display: flex; align-items: center; gap: 0.5rem;
    }
    .error { color: #c0392b; }
    @media (max-width: 640px) { header, main { padding: 1.5rem; } .header-right { gap: 1.5rem; } }
  </style>
</head>
<body>
<header>
  <div class="header-left">
    <a class="back-link" href="index.html">← All Funds</a>
    <h1>13F Holdings Tracker</h1>
  </div>
  <div class="header-right">
    <div class="stat">
      <div class="stat-label">Portfolio Value</div>
      <div class="stat-value green" id="total-value">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Positions</div>
      <div class="stat-value" id="total-positions">—</div>
    </div>
  </div>
</header>

<main>
  <div class="section-label" id="fund-name">Loading...</div>
  <div class="period-line" id="period">Loading...</div>
  <div class="quarter-selector" id="quarter-selector"></div>
  <div id="stale-warning" style="display:none" class="stale-warning"></div>
  <div id="table-container"><div class="loading">Fetching holdings data...</div></div>
</main>

<script>
  const PAGES = "/13f-holdings-tracker";

  const params = new URLSearchParams(window.location.search);
  const fundId = params.get("fund") || "pershing";

  let FUND_CONFIG   = null;
  let allQuarters   = [];
  let showQuarters  = [];
  let csvCache      = {};
  let metaCache     = {};
  let tickerMap     = {};  // cusip -> ticker
  let priceMap      = {};  // ticker -> {price, week52High, week52Low}
  let activeQ       = null;
  let sortCol       = 3;
  let sortAsc       = false;

  // ── Bootstrap ─────────────────────────────────────────────────
  Promise.all([
    fetch(`${PAGES}/funds.json`).then(r => r.text()).then(JSON.parse),
    fetch(`${PAGES}/cusip_to_ticker.json`).then(r => r.text()).then(JSON.parse).catch(() => ({})),
    fetch(`${PAGES}/prices.json`).then(r => r.text()).then(JSON.parse).catch(() => ({}))
  ]).then(([funds, tickers, prices]) => {
      tickerMap = tickers;
      priceMap  = prices;
      const f = funds.find(x => x.id === fundId);
      if (!f) {
        document.getElementById("table-container").innerHTML =
          `<div class="error">Fund "${fundId}" not found in funds.json</div>`;
        return;
      }
      FUND_CONFIG = f;
      document.getElementById("fund-name").textContent = f.name;

      // Parse "Fund Name (Manager Name)" for SEO
      const nameMatch = f.name.match(/^(.+?)\s*\((.+?)\)$/);
      const fundOnly    = nameMatch ? nameMatch[1].trim() : f.name;
      const managerOnly = nameMatch ? nameMatch[2].trim() : f.name;
      FUND_CONFIG._fundOnly    = fundOnly;
      FUND_CONFIG._managerOnly = managerOnly;

      document.title = `${fundOnly} (${managerOnly})`;
      loadQuarters();
    })
    .catch(e => {
      document.getElementById("table-container").innerHTML =
        `<div class="error">Failed to load fund config: ${e.message}</div>`;
    });

  // ── Quarter discovery ─────────────────────────────────────────
  async function loadQuarters() {
    const now  = new Date();
    let year   = now.getFullYear();
    let q      = Math.ceil((now.getMonth() + 1) / 3) - 1;
    if (q === 0) { q = 4; year--; }

    const candidates = [];
    for (let i = 0; i < 12; i++) {
      candidates.push(`${year}Q${q}`);
      q--;
      if (q === 0) { q = 4; year--; }
    }

    // Check all quarters in parallel
    const checks = await Promise.all(candidates.map(async label => {
      try {
        const r = await fetch(`${PAGES}/data/${fundId}_${label}.csv`);
        return r.ok ? label : null;
      } catch(e) { return null; }
    }));

    const found = checks.filter(Boolean);

    if (found.length === 0) {
      document.getElementById("table-container").innerHTML =
        `<div class="error">No data found. Run the workflow to fetch holdings.</div>`;
      return;
    }

    allQuarters  = found;           // up to 8, used for comparison lookups
    showQuarters = found.slice(0, 4); // only 4 shown as tabs
    activeQ      = showQuarters[0];

    // Render only 4 quarter buttons
    document.getElementById("quarter-selector").innerHTML = showQuarters.map(q =>
      `<button class="q-btn${q === activeQ ? " active" : ""}" onclick="switchQuarter('${q}')">${q}</button>`
    ).join("");

    const idx = allQuarters.indexOf(activeQ);
    await Promise.all([
      loadCSV(activeQ),
      idx + 1 < allQuarters.length ? loadCSV(allQuarters[idx + 1]) : Promise.resolve(),
      idx + 4 < allQuarters.length ? loadCSV(allQuarters[idx + 4]) : Promise.resolve(),
      loadMeta(activeQ)
    ]);
    renderTable();
  }

  // ── CSV loader ────────────────────────────────────────────────
  async function loadMeta(label) {
    if (metaCache[label]) return;
    try {
      const r = await fetch(`${PAGES}/data/${fundId}_${label}.json`);
      if (r.ok) metaCache[label] = await r.json();
    } catch(e) { /* no meta file */ }
  }

  // ── CSV loader ────────────────────────────────────────────────
  async function loadCSV(label) {
    if (csvCache[label]) return;
    const r     = await fetch(`${PAGES}/data/${fundId}_${label}.csv`);
    const text  = await r.text();
    const lines = text.trim().split("\n");
    csvCache[label] = lines.slice(1).map(line => {
      const cols = line.split(",");
      return {
        company:    cols[0]?.trim() || "",
        cusip:      cols[1]?.trim() || "",
        shares:     parseInt(cols[2]) || 0,
        value:      parseInt(cols[3]) || 0,
        discretion: cols[4]?.trim() || "",
        putcall:    cols[5]?.trim() || ""
      };
    });
  }

  // ── Quarter switcher ──────────────────────────────────────────
  async function switchQuarter(q) {
    activeQ = q;
    document.querySelectorAll(".q-btn").forEach(b =>
      b.classList.toggle("active", b.textContent === q)
    );
    const idx = allQuarters.indexOf(q);
    await Promise.all([
      loadCSV(q),
      idx + 1 < allQuarters.length ? loadCSV(allQuarters[idx + 1]) : Promise.resolve(),
      idx + 4 < allQuarters.length ? loadCSV(allQuarters[idx + 4]) : Promise.resolve(),
      loadMeta(q)
    ]);
    renderTable();
  }

  // ── Helpers ───────────────────────────────────────────────────
  function fmtDate(dateStr) {
    if (!dateStr) return "";
    const [year, month, day] = dateStr.split("-");
    const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    return `${months[parseInt(month)-1]} ${parseInt(day)}, ${year}`;
  }

  function quarterToDate(q) {
    const [year, qn] = q.split("Q");
    const ends = { "1": "March 31", "2": "June 30", "3": "September 30", "4": "December 31" };
    return `${ends[qn]}, ${year}`;
  }

  function getChange(currentShares, oldRows, cusip, company) {
    if (!oldRows) return null;
    let old = cusip ? oldRows.find(r => r.cusip === cusip) : null;
    if (!old) old = oldRows.find(r => r.company === company);
    if (!old)   return "NEW";
    if (currentShares === 0) return "EXITED";
    return ((currentShares - old.shares) / old.shares) * 100;
  }

  function fmtChg(val) {
    if (val === null)     return `<span class="chg na">—</span>`;
    if (val === "NEW")    return `<span class="chg new">NEW</span>`;
    if (val === "EXITED") return `<span class="chg exited">EXITED</span>`;
    const sign = val >= 0 ? "+" : "";
    const cls  = val >= 0 ? "pos" : "neg";
    return `<span class="chg ${cls}">${sign}${val.toFixed(2)}%</span>`;
  }

  // ── Group rows by CUSIP (fall back to company name) ───────────
  function groupByCompany(rows) {
    const map = new Map();
    for (const r of rows) {
      const key = r.cusip || r.company;
      if (map.has(key)) {
        const g = map.get(key);
        g.shares += r.shares;
        g.value  += r.value;
      } else {
        map.set(key, { ...r });
      }
    }
    return Array.from(map.values());
  }

  // ── Render ────────────────────────────────────────────────────
  function renderTable() {
    const mult  = (FUND_CONFIG && FUND_CONFIG.value_multiplier) ? FUND_CONFIG.value_multiplier : 1;
    const rows  = groupByCompany(csvCache[activeQ] || []);
    const idx   = allQuarters.indexOf(activeQ);
    const prev1 = idx + 1 < allQuarters.length ? groupByCompany(csvCache[allQuarters[idx + 1]] || []) : null;
    const prev4 = idx + 4 < allQuarters.length ? groupByCompany(csvCache[allQuarters[idx + 4]] || []) : null;

    const tv = rows.reduce((s, r) => s + r.value, 0) * mult;

    document.getElementById("total-value").textContent =
      "$" + tv.toLocaleString("en-US", { maximumFractionDigits: 0 });
    document.getElementById("total-positions").textContent = rows.length;
    const meta = metaCache[activeQ];
    const filedStr = meta ? ` <span style="font-weight:400">(Filed ${fmtDate(meta.filed)})</span>` : "";
    document.getElementById("period").innerHTML =
      `Holdings as of ${quarterToDate(activeQ)}${filedStr}`;

    // SEO meta tags
    const fundOnly    = FUND_CONFIG._fundOnly    || FUND_CONFIG.name;
    const managerOnly = FUND_CONFIG._managerOnly || FUND_CONFIG.name;
    const qLabel      = activeQ.replace("Q", " Q");  // "2025Q4" -> "2025 Q4" -> format nicely
    const qShort      = `Q${activeQ.split("Q")[1]} ${activeQ.split("Q")[0]}`; // "Q4 2025"
    const desc = `Track ${managerOnly}'s latest 13F holdings for ${qShort}. See what ${fundOnly} is buying and selling, position changes, and portfolio breakdown.`;
    document.querySelector('meta[name="description"]').setAttribute("content", desc);
    document.querySelector('meta[property="og:title"]').setAttribute("content", document.title);
    document.querySelector('meta[property="og:description"]').setAttribute("content", desc);
    const warningEl = document.getElementById("stale-warning");
    const [qYear, qNum] = activeQ.split("Q");
    const quarterDate = new Date(parseInt(qYear), parseInt(qNum) * 3, 1);
    const oneYearAgo  = new Date();
    oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);
    if (quarterDate < oneYearAgo) {
      warningEl.style.display = "block";
      warningEl.innerHTML = `⚠️ <strong>Data may be outdated.</strong> The most recent filing available is ${activeQ}. This fund may no longer be required to file with the SEC, or may have dropped below the $100M reporting threshold.`;
    } else {
      warningEl.style.display = "none";
    }

    const keys = ["company", "cusip", "shares", "value", "discretion"];
    const sorted = [...rows].sort((a, b) => {
      const key = keys[sortCol];
      const av = typeof a[key] === "string" ? a[key].toLowerCase() : a[key];
      const bv = typeof b[key] === "string" ? b[key].toLowerCase() : b[key];
      return sortAsc ? (av > bv ? 1 : -1) : (av < bv ? 1 : -1);
    });

    function arrow(i) { return sortCol === i ? (sortAsc ? " ↑" : " ↓") : ""; }

    const rowsHtml = sorted.map((r, i) => {
      const adjValue  = r.value * mult;
      const pct       = tv > 0 ? ((adjValue / tv) * 100).toFixed(2) : "0.00";
      const repPrice  = r.shares > 0 ? adjValue / r.shares : 0;
      const repPriceStr = "$" + repPrice.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const valueStr  = "$" + adjValue.toLocaleString("en-US", { maximumFractionDigits: 0 });
      const chg1      = getChange(r.shares, prev1, r.cusip, r.company);
      const chg4      = getChange(r.shares, prev4, r.cusip, r.company);
      const putcallHtml = r.putcall
        ? `<span class="putcall ${r.putcall.toLowerCase()}">${r.putcall.toUpperCase()}</span>`
        : `<span class="chg na">—</span>`;

      // Market data
      const ticker    = tickerMap[r.cusip] || null;
      const priceData = ticker ? priceMap[ticker] : null;
      const lastPrice = priceData ? priceData.price : null;
      const lastPriceStr = lastPrice ? "$" + lastPrice.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "—";
      const tickerHtml = ticker ? `<div style="color:#2563eb; font-weight:600; font-size:0.78rem; margin-top:0.1rem">${ticker}</div>` : "";

      let priceDiffHtml = `<span class="chg na">—</span>`;
      if (lastPrice && repPrice > 0) {
        const diff = ((lastPrice - repPrice) / repPrice) * 100;
        const sign = diff >= 0 ? "+" : "";
        const cls  = diff >= 0 ? "pos" : "neg";
        priceDiffHtml = `<span class="chg ${cls}">${sign}${diff.toFixed(2)}%</span>`;
      }

      return `
        <tr>
          <td class="num" style="color:var(--muted); font-size:0.72rem">${i + 1}</td>
          <td><div class="company-name">${r.company}</div>${tickerHtml}</td>
          <td class="num">${pct}%</td>
          <td class="num">${r.shares.toLocaleString()}</td>
          <td class="num">${fmtChg(chg1)}</td>
          <td class="num">${fmtChg(chg4)}</td>
          <td class="num">${valueStr}</td>
          <td class="num">${repPriceStr}</td>
          <td class="num">${lastPriceStr}</td>
          <td class="num">${priceDiffHtml}</td>
          <td class="num">${putcallHtml}</td>
        </tr>`;
    }).join("");

    // Exited positions — in prev1 but not in current quarter
    const exitedHtml = prev1 ? prev1
      .filter(p => !rows.find(r => r.cusip === p.cusip || r.company === p.company))
      .map(p => `
        <tr class="exited">
          <td class="num" style="color:var(--muted); font-size:0.72rem">—</td>
          <td><div class="company-name">${p.company}</div></td>
          <td class="num">—</td>
          <td class="num">—</td>
          <td class="num"><span class="chg exited">EXITED</span></td>
          <td class="num">—</td>
          <td class="num">—</td>
          <td class="num">—</td>
          <td class="num">—</td>
          <td class="num">—</td>
          <td class="num">—</td>
        </tr>`).join("") : "";

    document.getElementById("table-container").innerHTML = `
      <table>
        <thead>
          <tr>
            <th style="color:var(--muted)">#</th>
            <th onclick="sort(0)">Company${arrow(0)}</th>
            <th class="num" onclick="sort(3)">Weight${arrow(3)}</th>
            <th class="num" onclick="sort(2)">Shares${arrow(2)}</th>
            <th class="num">Shares vs Prior Quarter</th>
            <th class="num">Shares vs Prior Year</th>
            <th class="num" onclick="sort(3)">Value${arrow(3)}</th>
            <th class="num">Last Reported Price</th>
            <th class="num">Previous Close</th>
            <th class="num">+/- Last Reported</th>
            <th class="num">Option</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}${exitedHtml}</tbody>
      </table>`;
  }

  function sort(col) {
    if (sortCol === col) sortAsc = !sortAsc;
    else { sortCol = col; sortAsc = false; }
    renderTable();
  }
</script>
</body>
</html>
