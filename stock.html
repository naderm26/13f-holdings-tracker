

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stock Holdings | 13FAI</title>
  <meta name="description" content=""/>
  <meta property="og:type" content="website"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff; --surface: #f7f6f3; --border: #e8e6e1;
      --text: #1a1917; --muted: #8a8780; --accent: #2d5a3d;
      --accent-light: #eef4f0; --green: #2d6a3f; --red: #b91c1c;
      --mono: 'DM Mono', monospace; --sans: 'DM Sans', sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 1.5rem 3rem; display: flex; align-items: center;
      justify-content: space-between; flex-wrap: wrap; gap: 1rem;
    }
    .brand { display: flex; align-items: baseline; gap: 0.75rem; }
    .brand-name { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; color: var(--text); }
    .brand-sub { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); text-decoration: none; }
    /* ── Search ── */
    .search-wrap { position: relative; }
    #search {
      font-family: var(--sans); font-size: 0.875rem;
      padding: 0.6rem 1rem 0.6rem 2.25rem;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg); color: var(--text);
      width: 300px; outline: none; transition: border 0.15s;
    }
    #search:focus { border-color: var(--accent); background: var(--surface); }
    #search::placeholder { color: var(--muted); }
    .search-icon { position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.85rem; pointer-events: none; }
    .search-results {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; overflow: hidden; z-index: 100;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08); display: none;
    }
    .search-results.visible { display: block; }
    .search-result-item {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.75rem 1rem; text-decoration: none; color: var(--text);
      font-size: 0.875rem; border-bottom: 1px solid var(--border); transition: background 0.1s;
    }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:hover { background: var(--accent-light); }
    .search-result-num { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); min-width: 1.5rem; }
    .no-results { padding: 0.75rem 1rem; font-size: 0.875rem; color: var(--muted); }
    main { padding: 2.5rem 3rem; max-width: 1200px; margin: 0 auto; }

    /* Stock header */
    .stock-name { font-size: 1.4rem; font-weight: 500; margin-bottom: 0.3rem; }
    .stock-meta { display: flex; align-items: center; gap: 1.25rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .stock-ticker { font-family: var(--mono); font-size: 0.85rem; color: #2563eb; font-weight: 600; }
    .conviction-badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: var(--accent-light); border: 1px solid var(--accent);
      border-radius: 20px; padding: 0.25rem 0.75rem;
      font-size: 0.75rem; color: var(--accent); font-weight: 500;
    }
    .price-stats { display: flex; gap: 2rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .pstat-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 500; }
    .pstat-value { font-family: var(--mono); font-size: 1rem; font-weight: 500; margin-top: 0.1rem; }

    /* Quarter selector */
    .period-line { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); margin-bottom: 0.75rem; }

    /* Table — matches fund.html */
    table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow-x: auto; display: block; table-layout: fixed; }
    thead tr { background: var(--bg); border-bottom: 1px solid var(--border); }
    th { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; color: var(--muted); padding: 0.75rem 0.6rem; text-align: center; cursor: pointer; user-select: none; white-space: normal; line-height: 1.4; }
    th:nth-child(1) { text-align: center; width: 2.5rem; min-width: 2.5rem; max-width: 2.5rem; }
    th:nth-child(2) { text-align: left; width: 22%; }
    th:nth-child(n+3) { width: 8.8%; text-align: center; }
    th:hover { color: var(--text); }
    td { padding: 0.85rem 0.6rem; font-size: 0.875rem; border-bottom: 1px solid var(--border); vertical-align: middle; white-space: nowrap; text-align: center; }
    td:nth-child(1) { text-align: center; width: 2.5rem; min-width: 2.5rem; max-width: 2.5rem; }
    td:nth-child(2) { text-align: left; white-space: normal; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--accent-light); }
    td.num { font-family: var(--mono); font-size: 0.82rem; padding: 0.85rem 0.6rem; text-align: center; }
    .fund-name-cell { font-weight: 500; }
    .manager-cell { font-size: 0.75rem; color: var(--muted); margin-top: 0.1rem; }
    .fund-link { text-decoration: none; color: var(--text); }
    .fund-link:hover .fund-name-cell { color: var(--accent); }
    .chg { font-family: var(--mono); font-size: 0.82rem; font-weight: 500; }
    .chg.pos { color: var(--green); }
    .chg.neg { color: var(--red); }
    .chg.new { color: var(--green); font-size: 0.72rem; letter-spacing: 0.05em; }
    .chg.exited { color: var(--red); font-size: 0.72rem; letter-spacing: 0.05em; }
    .chg.na { color: var(--muted); }
    .putcall { font-family: var(--mono); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em; }
    .putcall.put  { color: var(--red); }
    .putcall.call { color: var(--green); }
    tr.exited td { color: var(--muted); background: #f0ede8; }
    .loading, .error { text-align: center; padding: 4rem; font-family: var(--mono); font-size: 0.85rem; color: var(--muted); }
    .error { color: #c0392b; }
    footer { text-align: center; padding: 2rem; font-family: var(--mono); font-size: 0.7rem; color: var(--muted); border-top: 1px solid var(--border); margin-top: 2rem; }
    footer a { color: var(--muted); text-decoration: none; }
    @media (max-width: 640px) { header, main { padding: 1.5rem; } }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <a class="brand-name" href="index.html">13FAI</a>
    <span class="brand-sub">AI-powered hedge fund holdings tracker</span>
  </div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="search" placeholder="Search funds, managers or stocks..." autocomplete="off"/>
    <div class="search-results" id="search-results"></div>
  </div>
</header>

<main>
  <div id="stock-header"><div class="loading">Loading stock data...</div></div>
  <div id="table-container"></div>
</main>

<footer>
  Data sourced from SEC EDGAR 13F-HR filings · For informational purposes only · <a href="disclaimer.html">Disclaimer</a>
</footer>

<script>
  const PAGES = "/13f-holdings-tracker";
  const params = new URLSearchParams(window.location.search);
  const key    = params.get("ticker") || params.get("cusip") || "";
  let sortCol  = 1; // default sort by % of portfolio
  let sortAsc  = false;
  let stockData  = null;
  let fundsData  = null;
  let fundTotals = {}; // fid -> total portfolio value (adjusted)
  let latestQ, prevQ, prevYearQ;

  function fmtChg(val) {
    if (val === null)     return `<span class="chg na">—</span>`;
    if (val === "NEW")    return `<span class="chg new">NEW</span>`;
    if (val === "EXITED") return `<span class="chg exited">EXITED</span>`;
    const sign = val >= 0 ? "+" : "";
    const cls  = val >= 0 ? "pos" : "neg";
    return `<span class="chg ${cls}">${sign}${val.toFixed(2)}%</span>`;
  }

  function getChg(currentShares, prevData) {
    if (!prevData) return null;
    if (!prevData.shares && currentShares > 0) return "NEW";
    if (currentShares === 0 && prevData.shares > 0) return "EXITED";
    if (!prevData.shares) return null;
    return ((currentShares - prevData.shares) / prevData.shares) * 100;
  }

  function fmtVal(v) {
    if (!v) return "—";
    if (v >= 1e9)  return "$" + (v / 1e9).toFixed(2) + "B";
    if (v >= 1e6)  return "$" + (v / 1e6).toFixed(1) + "M";
    return "$" + v.toLocaleString();
  }

  function fmtPct(val) {
    if (val === null || val === undefined || isNaN(val)) return "—";
    if (val === 0) return "—";
    return val.toFixed(2) + "%";
  }

  function arrow(i) { return sortCol === i ? (sortAsc ? " ↑" : " ↓") : ""; }

  function sort(col) {
    if (sortCol === col) sortAsc = !sortAsc;
    else { sortCol = col; sortAsc = false; }
    renderTable();
  }

  // Fetch CSV for a fund/quarter and return total adjusted value
  async function fetchFundTotal(fid, quarter, mult) {
    try {
      const r = await fetch(`${PAGES}/data/${fid}_${quarter}.csv`);
      if (!r.ok) return 0;
      const text = await r.text();
      const lines = text.trim().split("\n").slice(1);
      let total = 0;
      for (const line of lines) {
        const cols = line.split(",");
        const shares = parseInt(cols[2]) || 0;
        const value  = parseInt(cols[3]) || 0;
        if (shares > 0) total += value;
      }
      return total * mult;
    } catch(e) { return 0; }
  }

  function renderTable() {
    const stock    = stockData;
    const fundMap  = Object.fromEntries(fundsData.map(f => [f.id, f]));
    const prices   = pricesData;
    const ticker   = stock.ticker;

    const holdingFunds = [];
    const exitedFunds  = [];

    for (const fid of Object.keys(stock.funds)) {
      const fund   = fundMap[fid];
      if (!fund) continue;

      // Get this fund's own sorted quarters
      const fundQuarters = Object.keys(stock.funds[fid].quarters).sort().reverse();
      const fundLatestQ  = fundQuarters[0];
      const fundPrevQ    = fundQuarters[1] || null;
      const fundPrevYearQ = fundQuarters[4] || null;

      const latest = stock.funds[fid].quarters[fundLatestQ];
      const prev1  = fundPrevQ     ? stock.funds[fid].quarters[fundPrevQ]     : null;
      const prev4  = fundPrevYearQ ? stock.funds[fid].quarters[fundPrevYearQ] : null;

      if (latest && latest.shares > 0) {
        holdingFunds.push({ fid, fund, latest, prev1, prev4, fundLatestQ });
      } else if (prev1 && prev1.shares > 0) {
        exitedFunds.push({ fid, fund, latest: null, prev1, prev4 });
      }
    }

    // Sort
    const sortFn = (a, b) => {
      let av, bv;
      if (sortCol === 0)      { av = (fundMap[a.fid]?.name||"").toLowerCase(); bv = (fundMap[b.fid]?.name||"").toLowerCase(); }
      else if (sortCol === 1) { av = fundTotals[a.fid] > 0 ? a.latest.value * (fundMap[a.fid]?.value_multiplier||1) / fundTotals[a.fid] : 0; bv = fundTotals[b.fid] > 0 ? b.latest.value * (fundMap[b.fid]?.value_multiplier||1) / fundTotals[b.fid] : 0; }
      else if (sortCol === 2) { av = a.latest?.shares || 0; bv = b.latest?.shares || 0; }
      else if (sortCol === 3) { av = a.latest?.value  || 0; bv = b.latest?.value  || 0; }
      else if (sortCol === 4) { const ca = getChg(a.latest?.shares||0,a.prev1); const cb = getChg(b.latest?.shares||0,b.prev1); av = (typeof ca==='number') ? ca : (ca==="NEW"?1e9:(ca==="EXITED"?-1e9:0)); bv = (typeof cb==='number') ? cb : (cb==="NEW"?1e9:(cb==="EXITED"?-1e9:0)); }
      else if (sortCol === 5) { const ca = getChg(a.latest?.shares||0,a.prev4); const cb = getChg(b.latest?.shares||0,b.prev4); av = (typeof ca==='number') ? ca : (ca==="NEW"?1e9:(ca==="EXITED"?-1e9:0)); bv = (typeof cb==='number') ? cb : (cb==="NEW"?1e9:(cb==="EXITED"?-1e9:0)); }
      else if (sortCol === 6) { av = a.latest?.shares > 0 ? a.latest.value / a.latest.shares : 0; bv = b.latest?.shares > 0 ? b.latest.value / b.latest.shares : 0; }
      else                   { av = 0; bv = 0; }
      return sortAsc ? (av > bv ? 1 : -1) : (av < bv ? 1 : -1);
    };
    holdingFunds.sort(sortFn);

    // Total value
    const totalValue = holdingFunds.reduce((s, r) => s + (r.latest?.value || 0), 0);

    const rowsHtml = holdingFunds.map((item, i) => {
      const { fid, fund, latest, prev1, prev4 } = item;
      const nameMatch   = fund.name.match(/^(.+?)\s*\((.+?)\)$/);
      const fundOnly    = nameMatch ? nameMatch[1].trim() : fund.name;
      const managerOnly = nameMatch ? nameMatch[2].trim() : "";
      const mult        = fund.value_multiplier || 1;
      const adjValue    = latest.value * mult;
      const fundTotal   = fundTotals[fid] || 0;
      const pctNum      = fundTotal > 0 ? (adjValue / fundTotal) * 100 : 0;
      const pct         = fmtPct(pctNum);
      const chg1        = getChg(latest.shares, prev1);
      const chg4        = getChg(latest.shares, prev4);
      const repPrice    = latest.shares > 0 ? latest.value / latest.shares : 0;
      const repPriceStr = repPrice > 0 ? "$" + repPrice.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "—";
      const putcall     = latest.putcall || "";
      const putcallHtml = putcall
        ? `<span class="putcall ${putcall.toLowerCase()}">${putcall.toUpperCase()}</span>`
        : `<span class="chg na">—</span>`;

      return `
        <tr>
          <td class="num" style="color:var(--muted); font-size:0.72rem">${i + 1}</td>
          <td>
            <a class="fund-link" href="fund.html?fund=${fid}">
              <div class="fund-name-cell">${fundOnly}</div>
              ${managerOnly ? `<div class="manager-cell">${managerOnly}</div>` : ""}
            </a>
          </td>
          <td class="num">${pct}</td>
          <td class="num">${latest.shares.toLocaleString()}</td>
          <td class="num">${fmtChg(chg1)}</td>
          <td class="num">${fmtChg(chg4)}</td>
          <td class="num">${fmtVal(adjValue)}</td>
          <td class="num">${repPriceStr}</td>
          <td class="num">${putcallHtml}</td>
        </tr>`;
    }).join("");

    const exitedHtml = exitedFunds.map(item => {
      const { fid, fund } = item;
      const nameMatch   = fund.name.match(/^(.+?)\s*\((.+?)\)$/);
      const fundOnly    = nameMatch ? nameMatch[1].trim() : fund.name;
      const managerOnly = nameMatch ? nameMatch[2].trim() : "";
      return `
        <tr class="exited">
          <td class="num" style="font-size:0.72rem">—</td>
          <td>
            <a class="fund-link" href="fund.html?fund=${fid}">
              <div class="fund-name-cell">${fundOnly}</div>
              ${managerOnly ? `<div class="manager-cell">${managerOnly}</div>` : ""}
            </a>
          </td>
          <td class="num">—</td>
          <td class="num">—</td>
          <td class="num"><span class="chg exited">EXITED</span></td>
          <td class="num">—</td>
          <td class="num">—</td>
          <td class="num">—</td>
          <td class="num">—</td>
        </tr>`;
    }).join("");

    document.getElementById("table-container").innerHTML = `
      <table>
        <thead>
          <tr>
            <th style="width:2.5rem; min-width:2.5rem; max-width:2.5rem; color:var(--muted)">#</th>
            <th onclick="sort(0)">Fund${arrow(0)}</th>
            <th class="num" onclick="sort(1)">% of Portfolio${arrow(1)}</th>
            <th class="num" onclick="sort(2)">Shares${arrow(2)}</th>
            <th class="num" onclick="sort(4)">vs Prior Quarter${arrow(4)}</th>
            <th class="num" onclick="sort(5)">vs Prior Year${arrow(5)}</th>
            <th class="num" onclick="sort(3)">Value${arrow(3)}</th>
            <th class="num" onclick="sort(6)">Price at Last Filing *${arrow(6)}</th>
            <th class="num">Option</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}${exitedHtml}</tbody>
      </table>
      <div style="font-family:var(--mono); font-size:0.68rem; color:var(--muted); margin-top:0.75rem">
        * Price at last filing is calculated by dividing the reported value by shares held at quarter end. It represents the implied average price per share, not an actual purchase or sale price.
      </div>`;
  }

  if (!key) {
    document.getElementById("stock-header").innerHTML = `<div class="error">No stock specified.</div>`;
  } else {
    Promise.all([
      fetch(`${PAGES}/stock_index.json`).then(r => r.json()),
      fetch(`${PAGES}/funds.json`).then(r => r.text()).then(JSON.parse)
    ]).then(async ([stockIndex, funds]) => {
      const stock = stockIndex[key];
      if (!stock) {
        document.getElementById("stock-header").innerHTML =
          `<div class="error">No data found for "${key}".</div>`;
        return;
      }

      stockData  = stock;
      fundsData  = funds;
      pricesData = {};

      // Get sorted quarters (for header display only)
      const allQ = new Set();
      for (const fid of Object.keys(stock.funds))
        Object.keys(stock.funds[fid].quarters).forEach(q => allQ.add(q));
      const sortedQ = Array.from(allQ).sort().reverse();
      latestQ    = sortedQ[0];
      prevQ      = sortedQ[1] || null;
      prevYearQ  = sortedQ[4] || null;

      // Correct fund count: use each fund's own latest quarter
      let fundCount = 0;
      for (const fid of Object.keys(stock.funds)) {
        const fundQuarters = Object.keys(stock.funds[fid].quarters).sort().reverse();
        const fLatestQ = fundQuarters[0];
        const q = fLatestQ ? stock.funds[fid].quarters[fLatestQ] : null;
        if (q && q.shares > 0) fundCount++;
      }

      // Pre-fetch fund totals for % of portfolio (each fund's own latest quarter)
      const totalFetches = Object.keys(stock.funds).map(async fid => {
        const fund = funds.find(f => f.id === fid);
        if (!fund) return;
        const fundQuarters = Object.keys(stock.funds[fid].quarters).sort().reverse();
        const fLatestQ = fundQuarters[0];
        if (!fLatestQ) return;
        const mult = fund.value_multiplier || 1;
        fundTotals[fid] = await fetchFundTotal(fid, fLatestQ, mult);
      });
      await Promise.all(totalFetches);

      // SEO
      const desc = `See which hedge funds own ${stock.name}${stock.ticker ? ` (${stock.ticker})` : ""}. Track position sizes, portfolio weights, and quarterly changes from 13F filings.`;
      document.title = `${stock.name}${stock.ticker ? ` (${stock.ticker})` : ""} — Who Owns It | 13FAI`;
      document.querySelector('meta[name="description"]').setAttribute("content", desc);

      // Render stock header
      document.getElementById("stock-header").innerHTML = `
        <div class="stock-name">${stock.name}</div>
        <div class="stock-meta">
          ${stock.ticker ? `<span class="stock-ticker">${stock.ticker}</span>` : ""}
          <span class="conviction-badge">🏦 Held by ${fundCount} of ${funds.length} tracked funds</span>
        </div>`;

      renderTable();
    }).catch(e => {
      document.getElementById("stock-header").innerHTML =
        `<div class="error">Failed to load data: ${e.message}</div>`;
    });
  }

  // ── Search ─────────────────────────────────────────────────────
  let allFundsForSearch = [];
  let stockIndexForSearch = {};
  fetch(`${PAGES}/funds.json`).then(r => r.text()).then(t => { allFundsForSearch = JSON.parse(t); });
  fetch(`${PAGES}/stock_index.json`).then(r => r.json()).then(d => { stockIndexForSearch = d; }).catch(() => {});

  const searchInput   = document.getElementById("search");
  const searchResults = document.getElementById("search-results");

  searchInput.addEventListener("input", () => {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) { searchResults.classList.remove("visible"); return; }

    // Search funds
    const fundMatches = allFundsForSearch
      .filter(f => f.name.toLowerCase().includes(q))
      .slice(0, 4)
      .map(f => `
        <a class="search-result-item" href="fund.html?fund=${f.id}">
          <span class="search-result-tag">Fund</span>
          <span>${f.name}</span>
        </a>`);

    // Search stocks
    const stockMatches = [];
    for (const [key, stock] of Object.entries(stockIndexForSearch)) {
      if (stockMatches.length >= 4) break;
      if (
        (stock.ticker && stock.ticker.toLowerCase().includes(q)) ||
        (stock.name && stock.name.toLowerCase().includes(q))
      ) {
        stockMatches.push(`
          <a class="search-result-item" href="stock.html?ticker=${encodeURIComponent(key)}">
            <span class="search-result-tag">Stock</span>
            <span>${stock.name}${stock.ticker ? ` <span style="color:#2563eb;font-weight:600">${stock.ticker}</span>` : ""}</span>
          </a>`);
      }
    }

    const all = [...fundMatches, ...stockMatches];
    if (all.length === 0) {
      searchResults.innerHTML = `<div class="no-results">No results found</div>`;
    } else {
      searchResults.innerHTML = all.join("");
    }
    searchResults.classList.add("visible");
  });

  document.addEventListener("click", e => {
    if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
      searchResults.classList.remove("visible");
    }
  });
</script>
</body>
</html>
