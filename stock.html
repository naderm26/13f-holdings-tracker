




<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff; --surface: #f0f0f0; --border: #dedede;
      --text: #1a1917; --muted: #8a8780; --accent: #2d5a3d;
      --accent-light: #eef4f0; --green: #2d6a3f; --red: #b91c1c;
      --mono: 'DM Mono', monospace; --sans: 'DM Sans', sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 1.25rem; }
    .header-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem; }
    .brand { display: flex; align-items: baseline; gap: 0.75rem; }

    .brand-sub { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); text-decoration: none; }
    .nav-links { display: flex; align-items: center; gap: 0.25rem; flex-wrap: wrap; }
    .nav-link { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); text-decoration: none; padding: 0.35rem 0.6rem; border-radius: 4px; transition: color 0.15s, background 0.15s; white-space: nowrap; }
    .nav-link:hover { color: var(--accent); background: var(--accent-light); }
    .nav-link.active { color: var(--accent); font-weight: 500; }
    .header-nav-row { margin-top: 0.6rem; border-top: 1px solid var(--border); padding-top: 0.6rem; }
    @media (min-width: 700px) { header { padding: 1.5rem 3rem; } .header-nav-row { display: none; } .desktop-nav { display: flex !important; } }
    @media (max-width: 699px) { .desktop-nav { display: none !important; } }
    /* ── Search ── */
    .search-wrap { position: relative; }
    #search {
      font-family: var(--sans); font-size: 0.875rem;
      padding: 0.6rem 1rem 0.6rem 2.25rem;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg); color: var(--text);
      width: 200px; outline: none; transition: border 0.15s;
    }
    #search:focus { border-color: var(--accent); background: var(--surface); }
    #search::placeholder { color: var(--muted); }
    .search-icon-mq { } @media (min-width: 700px) { #search { width: 300px; } }
    .search-icon { position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.85rem; pointer-events: none; }
    .search-results {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; overflow: hidden; z-index: 100;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08); display: none;
    }
    .search-results.visible { display: block; }
    .search-result-item {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.75rem 1rem; text-decoration: none; color: var(--text);
      font-size: 0.875rem; border-bottom: 1px solid var(--border); transition: background 0.1s;
    }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:hover { background: var(--accent-light); }
    .search-result-num { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); min-width: 1.5rem; }
    .no-results { padding: 0.75rem 1rem; font-size: 0.875rem; color: var(--muted); }
    main { padding: 1.5rem 1.25rem 4rem; max-width: 1200px; margin: 0 auto; }
    @media (min-width: 700px) { main { padding: 2.5rem 3rem; } }

    /* Stock header */
    .stock-name { font-size: 1.4rem; font-weight: 500; margin-bottom: 0.3rem; }
    .stock-meta { display: flex; align-items: center; gap: 1.25rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .stock-ticker { font-family: var(--mono); font-size: 0.85rem; color: #2563eb; font-weight: 600; }
    .price-stats { display: flex; gap: 2rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .pstat-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 500; }
    .pstat-value { font-family: var(--mono); font-size: 1rem; font-weight: 500; margin-top: 0.1rem; }

    /* Quarter selector */
    .period-line { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); margin-bottom: 0.75rem; }
    .quarter-selector { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .q-btn { font-family: var(--mono); font-size: 0.72rem; padding: 0.35rem 0.75rem; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--muted); cursor: pointer; transition: all 0.15s; }
    .q-btn:hover { border-color: var(--accent); color: var(--accent); }
    .q-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* Table */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--border); border-radius: 6px; }
    table { width: 100%; min-width: 900px; border-collapse: collapse; background: var(--surface); }
    thead tr { background: var(--bg); border-bottom: 1px solid var(--border); }

    th.col-num  { width: 2.5rem; min-width: 2.5rem; max-width: 2.5rem; }
    th.col-fund { text-align: left; width: 20%; min-width: 140px; }
    th.col-data { min-width: 80px; text-align: center; }
    th:hover { color: var(--text); }
    td { padding: 0.85rem 0.6rem; font-size: 0.875rem; border-bottom: 1px solid var(--border); vertical-align: middle; white-space: nowrap; text-align: center; }
    td.col-num  { width: 2.5rem; min-width: 2.5rem; max-width: 2.5rem; }
    td.col-fund { text-align: left; white-space: normal; min-width: 140px; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--accent-light); }
    td.num { font-family: var(--mono); font-size: 0.82rem; padding: 0.85rem 0.6rem; text-align: center; }
    .fund-name-cell { font-weight: 500; }
    .manager-cell { font-size: 0.75rem; color: var(--muted); margin-top: 0.1rem; }
    .fund-link { text-decoration: none; color: var(--text); }
    .fund-link:hover .fund-name-cell { color: var(--accent); }
    .chg { font-family: var(--mono); font-size: 0.82rem; font-weight: 500; }
    .chg.pos { color: var(--green); }
    .chg.neg { color: var(--red); }
    .chg.new { color: var(--green); font-size: 0.72rem; letter-spacing: 0.05em; }
    .chg.exited { color: var(--red); font-size: 0.72rem; letter-spacing: 0.05em; }
    .chg.na { color: var(--muted); }
    .putcall { font-family: var(--mono); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em; }
    .putcall.put  { color: var(--red); }
    .putcall.call { color: var(--green); }
    tr.exited td { color: var(--muted); background: #f0ede8; }
    tr.total-row td { background: var(--bg); border-top: 2px solid var(--border); font-family: var(--mono); font-size: 0.82rem; }
    tr.total-row td.col-fund { font-family: var(--sans); font-size: 0.875rem; }
    /* ── Insights ── */
    .insights-wrap { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 0.9rem 0; margin-bottom: 1.25rem; }
    .insights { font-size: 0.875rem; line-height: 1.75; color: var(--text); }
    .insights ul { list-style: none; margin: 0; padding: 0; }
    .insights li { position: relative; padding-left: 1rem; padding-top: 0.15rem; padding-bottom: 0.15rem; }
    .insights li::before { content: "•"; position: absolute; left: 0; color: var(--muted); font-size: 0.75rem; top: 0.22rem; }
    .ins-green { color: var(--green); font-weight: 500; }
    .ins-red   { color: var(--red); font-weight: 500; }
    .ins-fund  { color: #2563eb; font-weight: 600; text-decoration: none; }
    .ins-fund:hover { text-decoration: underline; }
    .loading, .error { text-align: center; padding: 4rem; font-family: var(--mono); font-size: 0.85rem; color: var(--muted); }
    .error { color: #c0392b; }
    footer { text-align: center; padding: 2rem; font-family: var(--mono); font-size: 0.7rem; color: var(--muted); border-top: 1px solid var(--border); margin-top: 2rem; }
    footer a { color: var(--muted); text-decoration: none; }

    /* ── Sparkline ── */
    .sparkline-container { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1rem 1rem 0.5rem; position: relative; }
    .sparkline-label { font-family: var(--mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 0.6rem; }
    .sparkline-svg { width: 100%; overflow: visible; display: block; }
    .sparkline-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .sparkline-area { fill: var(--accent); opacity: 0.08; }
    .sparkline-dot { fill: var(--accent); }
    .sparkline-dot:hover { r: 5; }
    .sparkline-tooltip {
      position: absolute; background: var(--text); color: #fff;
      font-family: var(--mono); font-size: 0.72rem; line-height: 1.5;
      padding: 0.4rem 0.65rem; border-radius: 4px; pointer-events: none;
      white-space: nowrap; opacity: 0; transition: opacity 0.1s; z-index: 10;
      transform: translate(-50%, -100%); margin-top: -8px;
    }
    
  </style>

<main>

<footer>

<script>
  const PAGES = "/13f-holdings-tracker";
  const params = new URLSearchParams(window.location.search);
  const key    = params.get("ticker") || params.get("cusip") || "";
  let sortCol  = 1;
  let sortAsc  = false;
  let stockData    = null;
  let fundsData    = null;
  let fundTotals   = {};   // from stock_index fund_totals[fid][q]
  let allQuarters  = [];   // all quarter labels available for this stock, desc
  let activeQ      = null; // currently selected quarter

  // ── Formatters ────────────────────────────────────────────────
  function fmtChg(val) {
    if (val === null)     return `<span class="chg na">—</span>`;
    if (val === "NEW")    return `<span class="chg new">NEW</span>`;
    if (val === "EXITED") return `<span class="chg exited">EXITED</span>`;
    if (Math.abs(val) < 0.005) return `<span class="chg na">—</span>`;
    const sign = val >= 0 ? "+" : "";
    const cls  = val >= 0 ? "pos" : "neg";
    return `<span class="chg ${cls}">${sign}${val.toFixed(2)}%</span>`;
  }
  function fmtVal(v) {
    if (!v) return "—";
    if (v >= 1e9) return "$" + (v / 1e9).toFixed(2) + "B";
    if (v >= 1e6) return "$" + (v / 1e6).toFixed(1) + "M";
    return "$" + v.toLocaleString();
  }
  function fmtPct(val) {
    if (!val || isNaN(val) || val === 0) return "—";
    return val.toFixed(2) + "%";
  }
  function smartRound(v) {
    const r = Math.round(v);
    if (r === 0 && Math.abs(v) >= 0.05) return parseFloat(v.toFixed(1)).toString();
    return r.toString();
  }
  function fmtShares(n) {
    if (!n || n === 0) return "—";
    let scaled, suffix;
    if (n >= 1e6)      { scaled = n / 1e6; suffix = "M"; }
    else if (n >= 1e3) { scaled = n / 1e3; suffix = "K"; }
    else               { return n.toString(); }
    const mag = Math.floor(Math.log10(Math.abs(scaled)));
    const factor = Math.pow(10, 2 - mag);
    const rounded = Math.round(scaled * factor) / factor;
    const str = rounded % 1 === 0 ? rounded.toString() : rounded.toPrecision(3).replace(/\.?0+$/, "");
    return str + suffix;
  }
  function quarterLabel(q) {
    const m = q.match(/^(\d{4})Q(\d)$/);
    return m ? `Q${m[2]} ${m[1]}` : q;
  }
  function prevQuarter(q) {
    const [yr, qn] = q.split("Q");
    let pq = parseInt(qn) - 1, py = parseInt(yr);
    if (pq === 0) { pq = 4; py--; }
    return py + "Q" + pq;
  }
  function prevYearQuarter(q) {
    const [yr, qn] = q.split("Q");
    return (parseInt(yr) - 1) + "Q" + qn;
  }
  function arrow(i) { return sortCol === i ? (sortAsc ? " ↑" : " ↓") : ""; }
  function sort(col) {
    if (sortCol === col) sortAsc = !sortAsc;
    else { sortCol = col; sortAsc = false; }
    renderTable();
  }

  // ── Insights ──────────────────────────────────────────────────
  function renderStockInsights(holdingFunds, stock, fundMap, fundCount, totalFunds, selectedQ) {
    const el = document.getElementById("insights");
    if (!el) return;
    const stockLabel  = stock.ticker && stock.ticker !== stock.name ? `${stock.name} (${stock.ticker})` : stock.name;
    const shortTicker = stock.ticker || stock.name;
    const sentences   = [];
    const fundLink = fid => {
      const f = fundMap[fid];
      if (!f) return fid;
      const nm = f.name.match(/^(.+?)\s*\(/) ? f.name.match(/^(.+?)\s*\(/)[1].trim() : f.name;
      return `<a class="ins-fund" href="fund.html?fund=${fid}">${nm}</a>`;
    };

    // S1: Concentration
    const byPct = [...holdingFunds].filter(x => fundTotals[x.fid]?.[selectedQ] > 0)
      .sort((a, b) => (b.latest.value / fundTotals[b.fid][selectedQ]) - (a.latest.value / fundTotals[a.fid][selectedQ]));
    const top2 = byPct.slice(0, 2);
    const fmtHolder = x => {
      const ft = fundTotals[x.fid]?.[selectedQ] || 0;
      const pct = smartRound((x.latest.value / ft) * 100);
      return `${fundLink(x.fid)} (<b>${pct}%</b>)`;
    };
    let holdStr = "";
    if (top2.length === 1)     holdStr = `, with ${fmtHolder(top2[0])} holding the largest stake`;
    else if (top2.length >= 2) holdStr = `, with ${fmtHolder(top2[0])} and ${fmtHolder(top2[1])} holding the largest stakes`;
    const ownershipRatio = totalFunds > 0 ? (fundCount / totalFunds) * 100 : 0;
    const interestTier = ownershipRatio >= 30 ? "high" : ownershipRatio >= 20 ? "elevated" : ownershipRatio >= 10 ? "moderate" : "limited";
    sentences.push(`${stockLabel} is held by <b>${fundCount}</b> of <b>${totalFunds}</b> tracked hedge funds${holdStr}, indicating ${interestTier} hedge fund interest relative to peers.`);

    // S2: New positions
    const prevQ = prevQuarter(selectedQ);
    const newPos = holdingFunds.filter(x => {
      const prev = x.prev1;
      if (prev && prev.shares > 0) return false;
      const ft = fundTotals[x.fid]?.[selectedQ] || 0;
      return ft > 0 && (x.latest.value / ft) * 100 >= 1;
    }).sort((a, b) => (b.latest.value / (fundTotals[b.fid]?.[selectedQ] || 1)) - (a.latest.value / (fundTotals[a.fid]?.[selectedQ] || 1))).slice(0, 3);
    if (newPos.length > 0) {
      const parts = newPos.map(x => { const ft = fundTotals[x.fid]?.[selectedQ] || 0; return `${fundLink(x.fid)} (<b>${smartRound((x.latest.value / ft) * 100)}%</b>)`; });
      const joined = parts.length === 1 ? parts[0] : parts.slice(0, -1).join(", ") + ", and " + parts[parts.length - 1];
      sentences.push(`${parts.length === 1 ? "New position" : "New positions"} in ${shortTicker} stock ${parts.length === 1 ? "was initiated" : "were initiated"} by ${joined}.`);
    }

    // S3: Biggest increases
    const increases = holdingFunds.map(x => {
      const prev = x.prev1;
      if (!prev || prev.shares === 0 || x.latest.shares <= prev.shares) return null;
      const delta = x.latest.shares - prev.shares;
      const price = x.latest.shares > 0 ? x.latest.value / x.latest.shares : 0;
      return { fid: x.fid, sharePct: (delta / prev.shares) * 100, dollarImpact: delta * price };
    }).filter(Boolean).sort((a, b) => b.dollarImpact - a.dollarImpact).slice(0, 2);
    if (increases.length > 0) {
      const parts = increases.map(x => `${fundLink(x.fid)} (<span class="ins-green"><b>+${smartRound(x.sharePct)}%</b></span>)`);
      sentences.push(`The biggest increases in ${shortTicker} holdings came from ${parts.length === 1 ? parts[0] : parts[0] + " and " + parts[1]}, highlighting conviction.`);
    }

    // S4: Biggest decreases
    const decreases = holdingFunds.map(x => {
      const prev = x.prev1;
      if (!prev || prev.shares === 0 || x.latest.shares >= prev.shares) return null;
      const delta = x.latest.shares - prev.shares;
      const price = x.latest.shares > 0 ? x.latest.value / x.latest.shares : (prev.value / prev.shares);
      return { fid: x.fid, sharePct: (delta / prev.shares) * 100, dollarImpact: Math.abs(delta) * price };
    }).filter(Boolean).sort((a, b) => b.dollarImpact - a.dollarImpact).slice(0, 2);
    if (decreases.length > 0) {
      const parts = decreases.map(x => `${fundLink(x.fid)} (<span class="ins-red"><b>${smartRound(x.sharePct)}%</b></span>)`);
      sentences.push(`The biggest decreases in ${shortTicker} holdings came from ${parts.length === 1 ? parts[0] : parts[0] + " and " + parts[1]}, suggesting profit-taking or de-risking.`);
    }

    // S5: Exits (funds with prevQ data but no selectedQ data)
    const exitedFids = Object.keys(stock.funds).filter(fid => {
      const qData = stock.funds[fid].quarters;
      return qData[prevQ] && qData[prevQ].shares > 0 && (!qData[selectedQ] || qData[selectedQ].shares === 0);
    });
    if (exitedFids.length > 0) {
      const exitsSorted = exitedFids.map(fid => {
        const entry = stock.funds[fid].quarters[prevQ];
        const ft = fundTotals[fid]?.[prevQ] || 0;
        return { fid, prevPortPct: ft > 0 ? (entry.value / ft) * 100 : 0 };
      }).sort((a, b) => b.prevPortPct - a.prevPortPct);
      const notable = exitsSorted.filter(x => x.prevPortPct >= 1).slice(0, 2);
      const ledBy = notable.length > 0 ? `, led by ${notable.map(x => `${fundLink(x.fid)} (<b>${smartRound(x.prevPortPct)}%</b>)`).join(" and ")}` : "";
      sentences.push(`<b>${exitedFids.length}</b> ${exitedFids.length === 1 ? "hedge fund" : "hedge funds"} exited ${shortTicker}${ledBy}.`);
    }

    // Net trend
    let ns1 = 0, pt1 = 0, ns4 = 0, pt4 = 0;
    for (const x of holdingFunds) {
      if (x.prev1?.shares > 0) { ns1 += x.latest.shares - x.prev1.shares; pt1 += x.prev1.shares; }
      if (x.prev4?.shares > 0) { ns4 += x.latest.shares - x.prev4.shares; pt4 += x.prev4.shares; }
    }
    // include exits in net trend
    for (const fid of exitedFids) {
      const prev1data = stock.funds[fid].quarters[prevQ];
      const prevYrQ = prevYearQuarter(selectedQ);
      const prev4data = stock.funds[fid].quarters[prevYrQ];
      if (prev1data?.shares > 0) { ns1 += 0 - prev1data.shares; pt1 += prev1data.shares; }
      if (prev4data?.shares > 0) { ns4 += 0 - prev4data.shares; pt4 += prev4data.shares; }
    }
    if (pt1 > 0) {
      const p1 = (ns1 / pt1) * 100, s1 = p1 >= 0 ? "+" : "", c1 = p1 >= 0 ? "var(--green)" : "var(--red)";
      const verb = p1 >= 0 ? "increased" : "decreased";
      let yearStr = "";
      if (pt4 > 0) {
        const p4 = (ns4 / pt4) * 100, s4 = p4 >= 0 ? "+" : "", c4 = p4 >= 0 ? "var(--green)" : "var(--red)";
        yearStr = ` and <span style="color:${c4}"><b>${s4}${smartRound(p4)}%</b></span> vs prior year`;
      }
      sentences.push(`Overall, hedge funds ${verb} exposure to ${stockLabel} by <span style="color:${c1}"><b>${s1}${smartRound(p1)}%</b></span> vs the prior quarter${yearStr}.`);
    }

    el.innerHTML = `<ul>${sentences.map(s => `<li>${s}</li>`).join("")}</ul>`;
  }

  // ── Render table for selected quarter ─────────────────────────
  function renderTable() {
    const stock   = stockData;
    const fundMap = Object.fromEntries(fundsData.map(f => [f.id, f]));
    const selectedQ = activeQ;
    const prevQ     = prevQuarter(selectedQ);
    const prevYrQ   = prevYearQuarter(selectedQ);

    const holdingFunds = [];
    const exitedFunds  = [];

    for (const [fid, fundData] of Object.entries(stock.funds)) {
      const fund = fundMap[fid];
      if (!fund) continue;
      const qData   = fundData.quarters || {};
      const latest  = qData[selectedQ];
      const prev1   = qData[prevQ]   || null;
      const prev4   = qData[prevYrQ] || null;

      // Skip pure option positions (putcall set, shares/value zeroed by generate_stock_index)
      if (latest && latest.putcall && latest.shares === 0) continue;

      if (latest && latest.shares > 0) {
        holdingFunds.push({ fid, fund, latest, prev1, prev4 });
      } else if (prev1 && prev1.shares > 0) {
        // held last quarter but not this one → exited
        exitedFunds.push({ fid, fund, prev1 });
      }
    }

    // Sort
    holdingFunds.sort((a, b) => {
      let av, bv;
      const ftA = fundTotals[a.fid]?.[selectedQ] || 0;
      const ftB = fundTotals[b.fid]?.[selectedQ] || 0;
      if      (sortCol === 0) { return (sortAsc ? 1 : -1) * (fundMap[a.fid]?.name || "").localeCompare(fundMap[b.fid]?.name || ""); }
      else if (sortCol === 1) { av = ftA > 0 ? a.latest.value / ftA : 0; bv = ftB > 0 ? b.latest.value / ftB : 0; }
      else if (sortCol === 2) { av = a.latest.shares; bv = b.latest.shares; }
      else if (sortCol === 3) { av = a.latest.value;  bv = b.latest.value; }
      else if (sortCol === 4) { av = a.prev1?.shares > 0 ? (a.latest.shares - a.prev1.shares) / a.prev1.shares : (a.prev1 ? -1e9 : 1e9); bv = b.prev1?.shares > 0 ? (b.latest.shares - b.prev1.shares) / b.prev1.shares : (b.prev1 ? -1e9 : 1e9); }
      else if (sortCol === 5) { av = a.prev4?.shares > 0 ? (a.latest.shares - a.prev4.shares) / a.prev4.shares : (a.prev4 ? -1e9 : 1e9); bv = b.prev4?.shares > 0 ? (b.latest.shares - b.prev4.shares) / b.prev4.shares : (b.prev4 ? -1e9 : 1e9); }
      else if (sortCol === 6) { av = a.latest.shares > 0 ? a.latest.value / a.latest.shares : 0; bv = b.latest.shares > 0 ? b.latest.value / b.latest.shares : 0; }
      else { av = 0; bv = 0; }
      return sortAsc ? (av > bv ? 1 : -1) : (av < bv ? 1 : -1);
    });

    const rowsHtml = holdingFunds.map((item, i) => {
      const { fid, fund, latest, prev1, prev4 } = item;
      const nm = fund.name.match(/^(.+?)\s*\((.+?)\)$/);
      const fundOnly    = nm ? nm[1].trim() : fund.name;
      const managerOnly = nm ? nm[2].trim() : "";
      const bioSlug     = fund.bio_slug || null;
      const managerHtml = managerOnly
        ? bioSlug
          ? `<div class="manager-cell"><a href="${bioSlug}.html" style="color:#2563eb;text-decoration:none;">${managerOnly}</a></div>`
          : `<div class="manager-cell">${managerOnly}</div>`
        : "";
      const ft          = fundTotals[fid]?.[selectedQ] || 0;
      const pct         = fmtPct(ft > 0 ? (latest.value / ft) * 100 : 0);
      // chg: NEW if no prev1 data at all; EXITED handled separately
      // Exclude prev data if it was an option position
      const prev1equity = prev1 && !prev1.putcall ? prev1 : null;
      const prev4equity = prev4 && !prev4.putcall ? prev4 : null;
      const chg1Val = !prev1equity ? (selectedQ !== allQuarters[allQuarters.length - 1] ? "NEW" : null)
                    : prev1equity.shares === 0 ? "NEW"
                    : ((latest.shares - prev1equity.shares) / prev1equity.shares) * 100;
      const chg4Val = !prev4equity ? null
                    : prev4equity.shares === 0 ? "NEW"
                    : ((latest.shares - prev4equity.shares) / prev4equity.shares) * 100;
      const repPrice    = latest.shares > 0 ? latest.value / latest.shares : 0;
      const repPriceStr = repPrice > 0 ? "$" + repPrice.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "—";
      const putcall     = latest.putcall || "";
      const putcallHtml = putcall ? `<span class="putcall ${putcall.toLowerCase()}">${putcall.toUpperCase()}</span>` : `<span class="chg na">—</span>`;
      return `<tr>
        <td class="col-num num" style="color:var(--muted);font-size:0.72rem">${i + 1}</td>
        <td class="col-fund"><a class="fund-link" href="fund.html?fund=${fid}">
          <div class="fund-name-cell">${fundOnly}</div>
          ${managerHtml}
        </a></td>
        <td class="col-data num">${pct}</td>
        <td class="col-data num">${fmtShares(latest.shares)}</td>
        <td class="col-data num">${fmtChg(chg1Val)}</td>
        <td class="col-data num">${fmtChg(chg4Val)}</td>
        <td class="col-data num">${fmtVal(latest.value)}</td>
        <td class="col-data num">${repPriceStr}</td>
        <td class="col-data num">${putcallHtml}</td>
      </tr>`;
    }).join("");

    const exitedHtml = exitedFunds.map(({ fid, fund }) => {
      const nm = fund.name.match(/^(.+?)\s*\((.+?)\)$/);
      const fundOnly    = nm ? nm[1].trim() : fund.name;
      const managerOnly = nm ? nm[2].trim() : "";
      const exitBioSlug = fund.bio_slug || null;
      const exitMgrHtml = managerOnly
        ? exitBioSlug
          ? `<div class="manager-cell"><a href="${exitBioSlug}.html" style="color:#2563eb;text-decoration:none;">${managerOnly}</a></div>`
          : `<div class="manager-cell">${managerOnly}</div>`
        : "";
      return `<tr class="exited">
        <td class="col-num num" style="font-size:0.72rem">—</td>
        <td class="col-fund"><a class="fund-link" href="fund.html?fund=${fid}">
          <div class="fund-name-cell">${fundOnly}</div>
          ${exitMgrHtml}
        </a></td>
        <td class="col-data num">—</td><td class="col-data num">—</td>
        <td class="col-data num"><span class="chg exited">EXITED</span></td>
        <td class="col-data num">—</td><td class="col-data num">—</td><td class="col-data num">—</td><td class="col-data num">—</td>
      </tr>`;
    }).join("");

    // Total row — include exits in chgQtr/chgYr, exclude option positions
    const totalShares = holdingFunds.reduce((s, x) => s + x.latest.shares, 0);
    const totalValue  = holdingFunds.reduce((s, x) => s + x.latest.value, 0);
    let ns1 = 0, pt1 = 0, ns4 = 0, pt4 = 0;
    for (const x of holdingFunds) {
      // Skip if prev data is an option position
      if (x.prev1?.shares > 0 && !x.prev1.putcall) { ns1 += x.latest.shares - x.prev1.shares; pt1 += x.prev1.shares; }
      if (x.prev4?.shares > 0 && !x.prev4.putcall) { ns4 += x.latest.shares - x.prev4.shares; pt4 += x.prev4.shares; }
    }
    for (const { fid } of exitedFunds) {
      const prev1d = stock.funds[fid].quarters[prevQ];
      const prev4d = stock.funds[fid].quarters[prevYrQ];
      if (prev1d?.shares > 0 && !prev1d.putcall) { ns1 += 0 - prev1d.shares; pt1 += prev1d.shares; }
      if (prev4d?.shares > 0 && !prev4d.putcall) { ns4 += 0 - prev4d.shares; pt4 += prev4d.shares; }
    }
    const fmtTotalChg = (ns, pt) => {
      if (pt <= 0) return "—";
      const v = (ns / pt) * 100, s = v >= 0 ? "+" : "", cls = v >= 0 ? "pos" : "neg";
      return `<span class="chg ${cls}">${s}${v.toFixed(2)}%</span>`;
    };
    const totalRow = `<tr class="total-row">
      <td class="col-num num">${holdingFunds.length}</td>
      <td class="col-fund">Total</td>
      <td class="col-data num">—</td>
      <td class="col-data num">${fmtShares(totalShares)}</td>
      <td class="col-data num">${fmtTotalChg(ns1, pt1)}</td>
      <td class="col-data num">${fmtTotalChg(ns4, pt4)}</td>
      <td class="col-data num">${fmtVal(totalValue)}</td>
      <td class="col-data num">—</td><td class="col-data num">—</td>
    </tr>`;

    const fundCount = holdingFunds.length;
    renderStockInsights(holdingFunds, stock, fundMap, fundCount, fundsData.length, selectedQ);

    document.getElementById("table-container").innerHTML = `
      <div class="table-wrap"><table>
        <thead><tr>
          <th class="col-num" style="color:var(--muted)">#</th>
          <th class="col-fund" onclick="sort(0)">Fund${arrow(0)}</th>
          <th class="col-data num" onclick="sort(1)">% of Portfolio †${arrow(1)}</th>
          <th class="col-data num" onclick="sort(2)">Shares †${arrow(2)}</th>
          <th class="col-data num" onclick="sort(4)">Shares vs Prior Quarter †${arrow(4)}</th>
          <th class="col-data num" onclick="sort(5)">Shares vs Prior Year †${arrow(5)}</th>
          <th class="col-data num" onclick="sort(3)">Aggregate Value †${arrow(3)}</th>
          <th class="col-data num" onclick="sort(6)">Reported Price *${arrow(6)}</th>
          <th class="col-data num">Option</th>
        </tr></thead>
        <tbody>${rowsHtml}${exitedHtml}${totalRow}</tbody>
      </table></div>
      <div style="font-family:var(--mono);font-size:0.68rem;color:var(--muted);margin-top:0.75rem">
        * Reported price is not an actual purchase or sale price. It is the price as of the last portfolio date.<br/>
        † Portfolio value, share counts, and period-over-period changes exclude options positions (PUT/CALL), which are shown in the Option column for reference only.
      </div>`;
  }

  // ── Quarter tab rendering ──────────────────────────────────────
  function renderQuarterTabs() {
    const tabs = allQuarters.slice(0, 4);
    const wrap = document.getElementById("quarter-selector-wrap");
    wrap.innerHTML = `<div class="quarter-selector">${
      tabs.map(q => `<button class="q-btn${q === activeQ ? " active" : ""}" onclick="selectQuarter('${q}')">${quarterLabel(q)}</button>`).join("")
    }</div>`;
  }

  function selectQuarter(q) {
    activeQ = q;
    renderQuarterTabs();
    renderTable();
    // Update title
    const stock = stockData;
    const ql = quarterLabel(q);
    const titleStr = `${stock.name}${stock.ticker ? ` (${stock.ticker})` : ""} — Hedge Fund Ownership ${ql}`;
    document.title = `${titleStr} | 13F Holdings`;
    document.getElementById("stock-header").innerHTML = `<h1 class="stock-name" style="font-size:1.4rem;font-weight:500;margin-bottom:0.3rem">${titleStr}</h1>`;
  }

  // ── Sparkline ─────────────────────────────────────────────────
  function renderSparkline() {
    const wrap = document.getElementById("sparkline-wrap");
    if (!stockData || allQuarters.length < 2) { wrap.style.display = "none"; return; }

    const stock   = stockData;
    const fundMap = Object.fromEntries(fundsData.map(f => [f.id, f]));

    // Build aggregate shares per quarter across ALL funds (including exits = 0)
    const points = [...allQuarters].reverse().map(q => {
      let totalShares = 0, fundCount = 0;
      for (const [fid, fundData] of Object.entries(stock.funds)) {
        const qd = fundData.quarters?.[q];
        if (qd && qd.shares > 0 && !qd.putcall) { totalShares += qd.shares; fundCount++; }
      }
      return { q, totalShares, fundCount };
    });

    const W = 100, H = 60; // viewBox units
    const PAD = { l: 2, r: 2, t: 8, b: 20 };
    const xs = points.map((_, i) => PAD.l + (i / (points.length - 1)) * (W - PAD.l - PAD.r));
    const maxShares = Math.max(...points.map(p => p.totalShares), 1);
    const ys = points.map(p => PAD.t + (1 - p.totalShares / maxShares) * (H - PAD.t - PAD.b));

    const linePts  = points.map((_, i) => `${xs[i]},${ys[i]}`).join(" ");
    const areaPts  = `${xs[0]},${H - PAD.b} ` + points.map((_, i) => `${xs[i]},${ys[i]}`).join(" ") + ` ${xs[xs.length-1]},${H - PAD.b}`;

    // Quarter labels on x-axis
    const labels = points.map((p, i) => {
      const m = p.q.match(/(\d{4})Q(\d)/);
      const lbl = m ? `Q${m[2]} '${m[1].slice(2)}` : p.q;
      return `<text x="${xs[i]}" y="${H - PAD.b + 7}" text-anchor="middle" font-size="3.5" fill="var(--muted)" font-family="var(--mono)">${lbl}</text>`;
    }).join("");

    // Dots with hover areas
    function fmtSharesK(n) {
      if (n >= 1e9) return (n/1e9).toFixed(1)+'B';
      if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
      if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
      return n.toLocaleString();
    }
    const dots = points.map((p, i) => {
      const m = p.q.match(/(\d{4})Q(\d)/);
      const ql = m ? `Q${m[2]} ${m[1]}` : p.q;
      const tip = `${ql} · ${fmtSharesK(p.totalShares)} shares · ${p.fundCount} fund${p.fundCount !== 1 ? 's' : ''}`;
      return `<circle class="sparkline-dot" cx="${xs[i]}" cy="${ys[i]}" r="2.5" data-tip="${tip}" data-x="${xs[i]}" data-y="${ys[i]}"/>`;
    }).join("");

    wrap.style.display = "block";
    wrap.innerHTML = `
      <div class="sparkline-container">
        <div class="sparkline-label">Aggregate shares held — all tracked funds</div>
        <div class="sparkline-tooltip" id="spark-tip"></div>
        <svg class="sparkline-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
          <polygon class="sparkline-area" points="${areaPts}"/>
          <polyline class="sparkline-line" points="${linePts}"/>
          ${labels}
          ${dots}
        </svg>
      </div>`;

    // Tooltip interaction
    const tip = document.getElementById("spark-tip");
    wrap.querySelectorAll(".sparkline-dot").forEach(dot => {
      dot.addEventListener("mouseenter", e => {
        const svgRect = dot.closest("svg").getBoundingClientRect();
        const wrapRect = wrap.getBoundingClientRect();
        const cx = parseFloat(dot.getAttribute("cx"));
        const cy = parseFloat(dot.getAttribute("cy"));
        const svgW = svgRect.width, svgH = svgRect.height;
        const pxX = svgRect.left - wrapRect.left + (cx / W) * svgW;
        const pxY = svgRect.top  - wrapRect.top  + (cy / H) * svgH;
        tip.textContent = dot.dataset.tip;
        tip.style.left = pxX + "px";
        tip.style.top  = pxY + "px";
        tip.style.opacity = "1";
        dot.setAttribute("r", "4");
      });
      dot.addEventListener("mouseleave", () => {
        tip.style.opacity = "0";
        dot.setAttribute("r", "2.5");
      });
    });
  }

  // ── Bootstrap ──────────────────────────────────────────────────
  if (!key) {
    document.getElementById("stock-header").innerHTML = `<div class="error">No stock specified.</div>`;
  } else {
    Promise.all([
      fetch(`${PAGES}/stock_index.json`).then(r => r.json()),
      fetch(`${PAGES}/funds.json`).then(r => r.text()).then(JSON.parse)
    ]).then(([stockIndexRaw, funds]) => {
      const stockIndex = stockIndexRaw.stocks || stockIndexRaw;
      const stock = stockIndex[key];
      if (!stock) {
        document.getElementById("stock-header").innerHTML = `<div class="error">No data found for "${key}".</div>`;
        return;
      }
      stockData  = stock;
      fundsData  = funds;
      fundTotals = stockIndexRaw.fund_totals || {};

      // Collect all quarters across all funds for this stock
      const qSet = new Set();
      for (const fundData of Object.values(stock.funds)) {
        Object.keys(fundData.quarters || {}).forEach(q => qSet.add(q));
      }
      allQuarters = Array.from(qSet).sort().reverse();
      activeQ = allQuarters[0];

      // Title
      const ql = quarterLabel(activeQ);
      const titleStr = `${stock.name}${stock.ticker ? ` (${stock.ticker})` : ""} — Hedge Fund Ownership ${ql}`;
      document.title = `${titleStr} | 13F Holdings`;
      document.querySelector('meta[name="description"]').setAttribute("content",
        `See which hedge funds own ${stock.name}${stock.ticker ? ` (${stock.ticker})` : ""} as of ${ql}. Track position sizes, portfolio weights, and quarterly changes from 13F filings.`);
      document.getElementById("stock-header").innerHTML = `<h1 class="stock-name" style="font-size:1.4rem;font-weight:500;margin-bottom:0.3rem">${titleStr}</h1>`;

      renderQuarterTabs();
      renderTable();
      renderSparkline();
    }).catch(e => {
      document.getElementById("stock-header").innerHTML = `<div class="error">Failed to load data: ${e.message}</div>`;
    });
  }

  // ── Search ─────────────────────────────────────────────────────
  let allFundsForSearch = [];
  let stockIndexForSearch = {};
  fetch(`${PAGES}/funds.json`).then(r => r.text()).then(t => { allFundsForSearch = JSON.parse(t); });
  fetch(`${PAGES}/stock_index.json`).then(r => r.json()).then(d => { stockIndexForSearch = d.stocks || d; }).catch(() => {});

  const searchInput   = document.getElementById("search");
  const searchResults = document.getElementById("search-results");
  searchInput.addEventListener("input", () => {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) { searchResults.classList.remove("visible"); return; }
    const fundMatches = allFundsForSearch.filter(f => f.name.toLowerCase().includes(q)).slice(0, 4)
      .map(f => `<a class="search-result-item" href="fund.html?fund=${f.id}"><span class="search-result-tag">Fund</span><span>${f.name}</span></a>`);
    const stockMatches = [];
    for (const [k, s] of Object.entries(stockIndexForSearch)) {
      if (stockMatches.length >= 4) break;
      if ((s.ticker && s.ticker.toLowerCase().includes(q)) || (s.name && s.name.toLowerCase().includes(q)))
        stockMatches.push(`<a class="search-result-item" href="stock.html?ticker=${encodeURIComponent(k)}"><span class="search-result-tag">Stock</span><span>${s.name}${s.ticker ? ` <span style="color:#2563eb;font-weight:600">${s.ticker}</span>` : ""}</span></a>`);
    }
    const all = [...fundMatches, ...stockMatches];
    searchResults.innerHTML = all.length ? all.join("") : `<div class="no-results">No results found</div>`;
    searchResults.classList.add("visible");
  });
  document.addEventListener("click", e => {
    if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) searchResults.classList.remove("visible");
  });
</script>
</body>
</html>
