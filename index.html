
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>13F Holdings Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f6f3;
      --surface: #ffffff;
      --border: #e8e6e1;
      --text: #1a1917;
      --muted: #8a8780;
      --accent: #2d5a3d;
      --accent-light: #eef4f0;
      --mono: 'DM Mono', monospace;
      --sans: 'DM Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      padding: 0;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 2rem 3rem;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .header-left h1 {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
    }

    .header-left p {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.25rem;
      letter-spacing: 0.03em;
    }

    .header-right {
      display: flex;
      gap: 2.5rem;
    }

    .stat {
      text-align: right;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      font-weight: 500;
    }

    .stat-value {
      font-family: var(--mono);
      font-size: 1.4rem;
      font-weight: 500;
      color: var(--text);
      margin-top: 0.15rem;
    }

    .stat-value.green {
      color: var(--accent);
    }

    main {
      padding: 2.5rem 3rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    thead tr {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    th {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 500;
      color: var(--muted);
      padding: 0.85rem 1.25rem;
      text-align: left;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    th:hover { color: var(--text); }

    th.num, td.num { text-align: right; }

    td {
      padding: 0.9rem 1.25rem;
      font-size: 0.875rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }

    tr:hover td { background: var(--accent-light); }

    .company-name {
      font-weight: 500;
      color: var(--text);
    }

    .cusip {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }

    td.num {
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--text);
    }

    .weight-bar-wrap {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      justify-content: flex-end;
    }

    .weight-bar {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      width: 60px;
      overflow: hidden;
    }

    .weight-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    .weight-pct {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--text);
      min-width: 3.5rem;
      text-align: right;
    }

    .loading, .error {
      text-align: center;
      padding: 4rem;
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--muted);
    }

    .error { color: #c0392b; }

    @media (max-width: 640px) {
      header, main { padding: 1.5rem; }
      .header-right { gap: 1.5rem; }
      .stat-value { font-size: 1.1rem; }
      th, td { padding: 0.75rem 0.9rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>13F Holdings Tracker</h1>
  </div>
  <div class="header-right">
    <div class="stat">
      <div class="stat-label">Portfolio Value</div>
      <div class="stat-value green" id="total-value">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Positions</div>
      <div class="stat-value" id="total-positions">—</div>
    </div>
  </div>
</header>

<main>
  <div class="section-label">Pershing Square Capital Management — All Holdings</div>
  <div id="period" style="font-family: var(--mono); font-size: 0.75rem; color: var(--muted); margin-bottom: 1.25rem; margin-top: -0.5rem;">Loading...</div>
  <div id="table-container">
    <div class="loading">Fetching holdings data...</div>
  </div>
</main>


<<script>
  const csvUrl = `https://raw.githubusercontent.com/naderm26/13f-holdings-tracker/main/pershing_latest_13f.csv`;

  fetch(csvUrl)
    .then(res => {
      console.log("Status:", res.status);
      return res.text();
    })
    .then(text => {
      console.log("First 500 chars:", text.substring(0, 500));
    })
    .catch(err => {
      console.error("Fetch error:", err);
    });
</script>
