
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>13F Holdings Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f6f3;
      --surface: #ffffff;
      --border: #e8e6e1;
      --text: #1a1917;
      --muted: #8a8780;
      --accent: #2d5a3d;
      --accent-light: #eef4f0;
      --mono: 'DM Mono', monospace;
      --sans: 'DM Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 2rem 3rem;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    main {
      max-width: 600px;
      margin: 4rem auto;
      padding: 0 2rem;
    }

    .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 1.25rem;
    }

    .fund-list {
      list-style: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: var(--surface);
    }

    .fund-list li {
      border-bottom: 1px solid var(--border);
    }

    .fund-list li:last-child {
      border-bottom: none;
    }

    .fund-list a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 1.5rem;
      text-decoration: none;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 500;
      transition: background 0.15s;
    }

    .fund-list a:hover {
      background: var(--accent-light);
    }

    .fund-list a::after {
      content: "→";
      font-family: var(--mono);
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<header>
  <h1>13F Holdings Tracker</h1>
</header>

<main>
  <div class="label">Select a Fund</div>
  <ul class="fund-list">
    <li><a href="fund.html?fund=pershing">Pershing Square Capital Management</a></li>
    <li><a href="fund.html?fund=duquesne">Duquesne Family Office LLC</a></li>
  </ul>
</main>

</body>
</html>
