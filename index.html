




<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>13FAI — AI-Powered Hedge Fund Holdings Tracker</title>
  <meta name="description" content="Track 13F filings from the world's top hedge fund managers. See what Buffett, Ackman, Burry and others are buying and selling every quarter."/>
  <meta property="og:title" content="13FAI — AI-Powered Hedge Fund Holdings Tracker"/>
  <meta property="og:description" content="Track 13F filings from the world's top hedge fund managers. See what Buffett, Ackman, Burry and others are buying and selling every quarter."/>
  <meta property="og:type" content="website"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff; --surface: #f0f0f0; --border: #dedede;
      --text: #1a1917; --muted: #8a8780; --accent: #2d5a3d;
      --accent-light: #eef4f0; --mono: 'DM Mono', monospace; --sans: 'DM Sans', sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }

    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 1.25rem; }
    .header-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem; }
    .brand { display: flex; align-items: baseline; gap: 0.75rem; }
    .brand-name { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
    .brand-sub { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); }
    .nav-links { display: flex; align-items: center; gap: 0.25rem; flex-wrap: wrap; }
    .nav-link { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); text-decoration: none; padding: 0.35rem 0.6rem; border-radius: 4px; transition: color 0.15s, background 0.15s; white-space: nowrap; }
    .nav-link:hover { color: var(--accent); background: var(--accent-light); }
    .nav-link.active { color: var(--accent); font-weight: 500; }
    .header-nav-row { margin-top: 0.6rem; border-top: 1px solid var(--border); padding-top: 0.6rem; }
    @media (min-width: 700px) { header { padding: 1.5rem 3rem; } .header-nav-row { display: none; } .desktop-nav { display: flex !important; } }
    @media (max-width: 699px) { .desktop-nav { display: none !important; } }
    .search-wrap { position: relative; }
    #search {
      font-family: var(--sans); font-size: 0.875rem;
      padding: 0.6rem 1rem 0.6rem 2.25rem;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg); color: var(--text);
      width: 200px; outline: none; transition: border 0.15s;
    }
    @media (min-width: 700px) { #search { width: 300px;
    }
    #search:focus { border-color: var(--accent); background: var(--surface); }
    #search::placeholder { color: var(--muted); }
    .search-icon { position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.85rem; pointer-events: none; }
    .search-results {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; overflow: hidden; z-index: 100;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08); display: none;
    }
    .search-results.visible { display: block; }
    .search-result-item {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.75rem 1rem; text-decoration: none; color: var(--text);
      font-size: 0.875rem; border-bottom: 1px solid var(--border); transition: background 0.1s;
    }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:hover { background: var(--accent-light); }
    .search-result-num { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); min-width: 1.5rem; }
    .no-results { padding: 0.75rem 1rem; font-size: 0.875rem; color: var(--muted); }

    /* ── Hero ── */
    .hero { padding: 2.5rem 3rem 0; max-width: 1300px; margin: 0 auto; }
    .hero h2 { font-size: 1.6rem; font-weight: 500; letter-spacing: -0.01em; margin-bottom: 0.4rem; }
    .hero p { font-size: 0.9rem; color: var(--muted); max-width: 560px; line-height: 1.6; }

    /* ── Main layout ── */
    main { max-width: 800px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
    @media (min-width: 700px) { main { padding: 2rem 3rem 4rem; } }

    /* ── Column headers ── */
    .col-header { margin-bottom: 0.85rem; }
    .col-label {
      font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--accent); font-weight: 600;
    }
    .col-desc { font-size: 0.78rem; color: var(--muted); margin-top: 0.2rem; }

    /* ── Fund list ── */
    .fund-list { list-style: none; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
    .fund-list li { border-bottom: 1px solid var(--border); }
    .fund-list li:last-child { border-bottom: none; }
    .fund-list a {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.85rem 1.1rem; text-decoration: none; color: var(--text);
      font-size: 0.855rem; transition: background 0.1s;
    }
    .fund-list a:hover { background: var(--accent-light); }
    .rank { font-family: var(--mono); font-size: 0.68rem; color: var(--muted); min-width: 1rem; max-width: 1rem; text-align: right; flex-shrink: 0; }
    .fund-info { flex: 1; min-width: 0; }
    .fund-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fund-meta { font-family: var(--mono); font-size: 0.68rem; color: var(--muted); margin-top: 0.15rem; }
    .arrow { font-family: var(--mono); color: var(--border); font-size: 0.8rem; flex-shrink: 0; transition: color 0.1s; }
    .fund-list a:hover .arrow { color: var(--accent); }
    .loading { padding: 1.5rem; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); text-align: center; }

    /* ── All funds list — scrollable ── */
    .scrollable { max-height: 600px; overflow-y: auto; border-radius: 8px; }
    .scrollable::-webkit-scrollbar { width: 4px; }
    .scrollable::-webkit-scrollbar-track { background: transparent; }
    .scrollable::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Footer ── */
    footer { text-align: center; padding: 2rem; font-family: var(--mono); font-size: 0.7rem; color: var(--muted); border-top: 1px solid var(--border); }

    @media (max-width: 600px) {
      header, main { padding-left: 1.25rem; padding-right: 1.25rem; }
      #search { width: 200px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div style="display:flex; align-items:center; gap:1.75rem;">
      <div class="brand"><a class="brand-name" href="index.html">13FAI</a></div>
      <nav class="nav-links desktop-nav">
        <a class="nav-link active" href="index.html">Funds</a>
        <a class="nav-link" href="top-holdings.html">Top 10 Holdings</a>
        <a class="nav-link" href="top-holdings.html#top100">Top 100 Holdings</a>
        <a class="nav-link" href="hedge-fund-activity.html">Activity</a>
      </nav>
    </div>
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="search" placeholder="Search funds, managers or stocks..." autocomplete="off"/>
      <div class="search-results" id="search-results"></div>
    </div>
  </div>
  <div class="header-nav-row">
    <nav class="nav-links">
      <a class="nav-link active" href="index.html">Funds</a>
      <a class="nav-link" href="top-holdings.html">Top 10</a>
      <a class="nav-link" href="top-holdings.html#top100">Top 100</a>
      <a class="nav-link" href="hedge-fund-activity.html">Activity</a>
    </nav>
  </div>
</header>

<main>
  <div>
    <div class="col-header">
      <div class="col-label">Most Followed</div>
      <div class="col-desc">Managers retail investors watch closely</div>
    </div>
    <ul class="fund-list" id="list-popular"><li><div class="loading">Loading...</div></li></ul>

    <div class="col-header" style="margin-top:2rem">
      <div class="col-label">All Funds</div>
      <div class="col-desc">Complete list of tracked managers</div>
    </div>
    <ul class="fund-list scrollable" id="list-all"><li><div class="loading">Loading...</div></li></ul>
  </div>
</main>

<footer>
  Data sourced from 13F filings · Updated quarterly · <a href="disclaimer.html" style="color:var(--muted); text-decoration:none">Disclaimer</a>
</footer>

<script>
  const BASE = "/13f-holdings-tracker";

  // Curated popular list — retail investor favorites
  const POPULAR_IDS = [
    "berkshire",    // Warren Buffett
    "pershing",     // Bill Ackman
    "scion",        // Michael Burry
    "duquesne",     // Stanley Druckenmiller
    "appaloosa",    // David Tepper
    "baupost",      // Seth Klarman
    "third_point",  // Daniel Loeb
    "greenlight",   // David Einhorn
    "thiel_macro",  // Peter Thiel
    "tci",          // Chris Hohn
  ];

  let allFunds  = [];
  let stockIndex = {};

  function fmtAUM(aum) {
    if (!aum) return "";
    if (aum >= 1e12) return `$${(aum / 1e12).toFixed(1)}T`;
    if (aum >= 1e9)  return `$${(aum / 1e9).toFixed(1)}B`;
    if (aum >= 1e6)  return `$${(aum / 1e6).toFixed(0)}M`;
    return `$${aum.toLocaleString()}`;
  }

  function fmtDate(dateStr) {
    if (!dateStr) return "";
    const [year, month, day] = dateStr.split("-");
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return `${months[parseInt(month)-1]} ${parseInt(day)}, ${year}`;
  }

  function fundItem(id, name, rank, meta) {
    return `
      <li>
        <a href="fund.html?fund=${id}">
          <span class="rank">${rank}.</span>
          <span class="fund-info">
            <span class="fund-name">${name}<span class="fund-last-updated" data-fund-id="${id}" style="color:#2563eb; font-family:var(--mono); font-size:0.68rem; font-weight:400; margin-left:0.5rem;"></span></span>
            ${meta ? `<span class="fund-meta">${meta}</span>` : ""}
          </span>
          <span class="arrow">→</span>
        </a>
      </li>`;
  }

  async function loadData() {
    const fundsRes = await fetch(`${BASE}/funds.json`);
    const text = await fundsRes.text();
    allFunds = JSON.parse(text);

    // Load stock index for search (don't block on failure)
    try {
      const res = await fetch(`${BASE}/stock_index.json`);
      if (res.ok) stockIndex = await res.json();
    } catch(e) { /* stock index not yet generated */ }

    renderPopular();
    renderAll();
    loadLastUpdatedDates();
  }

  function renderPopular() {
    const el = document.getElementById("list-popular");
    const funds = POPULAR_IDS.map(id => allFunds.find(f => f.id === id)).filter(Boolean);
    el.innerHTML = funds.map((f, i) => fundItem(f.id, f.name, i + 1, null)).join("");
  }

  function renderAll() {
    const el = document.getElementById("list-all");
    el.innerHTML = allFunds.map((f, i) => fundItem(f.id, f.name, i + 1, null)).join("");
  }

  // Fetch latest filed date for each fund and inject into the DOM
  async function loadLastUpdatedDates() {
    const now = new Date();
    let year = now.getFullYear();
    let q = Math.ceil((now.getMonth() + 1) / 3) - 1;
    if (q === 0) { q = 4; year--; }

    // Build candidate quarter labels (last 8)
    const candidates = [];
    let cy = year, cq = q;
    for (let i = 0; i < 8; i++) {
      candidates.push(`${cy}Q${cq}`);
      cq--;
      if (cq === 0) { cq = 4; cy--; }
    }

    // For each fund, find first available quarter metadata in parallel
    await Promise.all(allFunds.map(async (fund) => {
      for (const label of candidates) {
        try {
          const r = await fetch(`${BASE}/data/${fund.id}_${label}.json`);
          if (r.ok) {
            const meta = await r.json();
            if (meta && meta.filed) {
              const dateStr = `· ${fmtDate(meta.filed)}`;
              document.querySelectorAll(`[data-fund-id="${fund.id}"]`).forEach(el => {
                el.textContent = dateStr;
              });
            }
            return; // stop at first found
          }
        } catch(e) { /* skip */ }
      }
    }));
  }

  // ── Search ─────────────────────────────────────────────────────
  const searchInput   = document.getElementById("search");
  const searchResults = document.getElementById("search-results");

  searchInput.addEventListener("input", () => {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) { searchResults.classList.remove("visible"); return; }

    // Search funds
    const fundMatches = allFunds
      .filter(f => f.name.toLowerCase().includes(q))
      .slice(0, 4)
      .map(f => `
        <a class="search-result-item" href="fund.html?fund=${f.id}">
          <span class="search-result-num">Fund</span>
          <span>${f.name}</span>
        </a>`);

    // Search stocks by ticker or company name
    const stockMatches = [];
    for (const [key, stock] of Object.entries(stockIndex)) {
      if (stockMatches.length >= 4) break;
      if (
        (stock.ticker && stock.ticker.toLowerCase().includes(q)) ||
        stock.name.toLowerCase().includes(q)
      ) {
        stockMatches.push(`
          <a class="search-result-item" href="stock.html?ticker=${encodeURIComponent(key)}">
            <span class="search-result-num">Stock</span>
            <span>${stock.name}${stock.ticker ? ` <span style="color:#2563eb;font-weight:600">${stock.ticker}</span>` : ""}</span>
          </a>`);
      }
    }

    const all = [...fundMatches, ...stockMatches];
    if (all.length === 0) {
      searchResults.innerHTML = `<div class="no-results">No results found</div>`;
    } else {
      searchResults.innerHTML = all.join("");
    }
    searchResults.classList.add("visible");
  });

  document.addEventListener("click", e => {
    if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
      searchResults.classList.remove("visible");
    }
  });

  loadData();
</script>
</body>
</html>
