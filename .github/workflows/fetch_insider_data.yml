name: Fetch Insider Data (Form 4)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1-5'  # 10am UTC weekdays — after market open

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch Form 4 insider data
        run: python fetch_insider_data.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/insiders/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update insider trading data"
          git push
