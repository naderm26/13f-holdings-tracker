name: Add Manual Ticker Mappings

on:
  workflow_dispatch:

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add manual mappings
        run: python add_manual_tickers.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cusip_to_ticker.json
          git commit -m "Add manual CUSIP to ticker mappings" || echo "No changes"
          git push --force
