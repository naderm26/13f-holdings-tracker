name: Build Company CIKs

on:
  workflow_dispatch:  # manual only — run once, then update when S&P 500 changes

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build company_ciks.json
        run: python build_company_ciks.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add company_ciks.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update company CIK mappings"
          git push
