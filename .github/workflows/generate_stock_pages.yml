name: Generate Stock Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Generate Stock Index"]
    types: [completed]

jobs:
  generate:
    runs-on: ubuntu-latest
    # Only run if triggered workflow succeeded (ignored for manual runs)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest changes
        run: git pull origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create stocks directory
        run: mkdir -p stocks

      - name: Sanitize tickers with slashes
        run: |
          python3 << 'EOF'
          import json
          with open("stock_index.json") as f:
              raw = json.load(f)
          stock_index = raw.get("stocks", raw)
          bad = [k for k, v in stock_index.items() if "/" in v.get("ticker", "")]
          print(f"Tickers with slashes (skipping): {bad}")
          for k in bad:
              del stock_index[k]
          raw["stocks"] = stock_index
          with open("stock_index.json", "w") as f:
              json.dump(raw, f)
          EOF

      - name: Generate stock pages
        run: python generate_stock_pages.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stocks/ sitemap.xml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: regenerate stock pages"
          git push
