name: Generate Stock Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Generate Stock Index"]
    types: [completed]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: mkdir -p stocks
      - name: Patch ticker slash bug
        run: |
          python3 -c "
          with open('generate_stock_pages.py') as f:
              code = f.read()
          if 'if \"/\" in ticker' not in code:
              code = code.replace(
                  '        ticker = stock.get(\"ticker\", key)\n',
                  '        ticker = stock.get(\"ticker\", key)\n        if \"/\" in ticker:\n            continue\n'
              )
              with open('generate_stock_pages.py', 'w') as f:
                  f.write(code)
              print('Patched')
          else:
              print('Already patched')
          "
      - run: python generate_stock_pages.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Generate stock pages"
