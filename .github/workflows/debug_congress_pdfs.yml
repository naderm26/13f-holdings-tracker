name: Debug Congressional PDFs

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pdfplumber requests beautifulsoup4

      - name: Fetch and keep PDFs
        run: python fetch_congress_data.py --keep-pdfs

      - name: Run full debug inspection
        run: python debug_pdf.py

      - name: Deep dive MTG November 2025 docs (ADP trade 11/12/2025)
        run: |
          python debug_pdf.py 20033314
          python debug_pdf.py 20033360
          python debug_pdf.py 20033428
          python debug_pdf.py 20033462

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/congress/ || true
          git diff --cached --quiet || (git pull --rebase && git commit -m "Debug run: update congress JSON" && git push)
