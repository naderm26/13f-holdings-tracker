name: Debug Congressional PDFs

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pdfplumber requests beautifulsoup4

      - name: Fetch and keep PDFs
        run: python fetch_congress_data.py --keep-pdfs

      - name: Run debug inspection
        run: python debug_pdf.py

      - name: Commit updated JSON (with skipped field)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/congress/ || true
          git diff --cached --quiet || git commit -m "Debug run: update congress JSON with skipped trades"
          git push
