name: Generate Stock Index

on:
  workflow_dispatch:
  # Also run after fetch data completes
  push:
    paths:
      - 'data/*.csv'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate stock index
        run: python generate_stock_index.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add stock_index.json
          git commit -m "Update stock index" || echo "No changes"
          git push --force
