name: Fetch 13F

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Run fetch script
        run: python fetch_13f.py

      - name: Commit results
        run: |
          git config user.email "nadermassoudi@aol.com"
          git config user.name "GitHub Actions"
          git add pershing_latest_13f.xml
          git diff --staged --quiet || git commit -m "Update Pershing 13F data"
          git push
