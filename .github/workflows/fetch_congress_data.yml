name: Fetch Congressional Trading Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'  # Every Monday 10am UTC

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pdfplumber requests beautifulsoup4

      - name: Fetch trades
        run: python fetch_congress_data.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/congress/ || true
          git diff --cached --quiet || (git pull --rebase && git commit -m "Update congressional trading data" && git push)
