name: Fetch Congressional Trading Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 2'  # Tuesday 9am UTC
    - cron: '0 9 * * 5'  # Friday 9am UTC

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pdfplumber requests beautifulsoup4

      - name: Clear PDF cache
        run: rm -rf _ptr_cache/

      - name: Fetch trades
        run: python fetch_congress_data.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/congress/
          git stash --include-untracked || true
          git pull --rebase
          git stash pop || true
          git add data/congress/
          git diff --cached --quiet || git commit -m "Update congressional trading data"
          git push
