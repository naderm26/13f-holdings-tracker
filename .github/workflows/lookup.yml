name: Lookup CIKs

on:
  workflow_dispatch:

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CIK lookup
        run: python lookup_ciks.py

      - name: Show results
        run: cat cik_lookup_results.json
