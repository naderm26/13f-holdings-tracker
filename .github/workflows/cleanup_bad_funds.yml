name: Cleanup Bad Fund Files

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete bad fund files
        run: |
          rm -f data/appaloosa_*.xml data/appaloosa_*.csv
          rm -f data/baupost_*.xml data/baupost_*.csv
          echo "Deleted appaloosa and baupost files"
          ls data/ | grep -E "appaloosa|baupost" || echo "Confirmed: no appaloosa/baupost files remain"

      - name: Commit cleanup
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Remove bad appaloosa and baupost files" || echo "Nothing to commit"
          git push
