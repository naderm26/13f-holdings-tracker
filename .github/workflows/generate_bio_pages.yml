name: Generate Manager Bio Pages

on:
  # Auto-run after quarterly data fetch
  workflow_run:
    workflows: ["Fetch 13F v3"]
    types: [completed]
  # Also run after stock index is rebuilt
  push:
    paths:
      - 'data/*.json'
      - 'funds_content.json'
  # Manual trigger
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate bio pages
        run: python generate_pages.py

      - name: Commit generated pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *-portfolio.html
          git diff --cached --quiet || git commit -m "Auto-generate manager bio pages [skip ci]"
          git push
