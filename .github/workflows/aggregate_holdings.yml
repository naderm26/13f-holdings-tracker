name: Generate Aggregate Holdings CSV

on:
  workflow_dispatch:   # manual trigger only

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run aggregate script
        run: python aggregate_holdings.py

      - name: Upload CSV as artifact
        uses: actions/upload-artifact@v4
        with:
          name: aggregate_holdings
          path: aggregate_holdings.csv
          retention-days: 30
