name: RSS Monitor — Auto-fetch New 13F Filings

on:
  schedule:
    - cron: '0 22 * * 1-5'  # Weekdays at 22:00 UTC (6pm ET / 7pm EDT)
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # needed to trigger fetch2.yml

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check EDGAR for new filings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python rss_monitor.py

      - name: Report result
        run: cat rss_check_result.txt
