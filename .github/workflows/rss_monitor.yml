name: RSS Monitor — Auto-fetch New 13F Filings

on:
  schedule:
    - cron: '0 9 * * *'  # Every day at 9am UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # needed to trigger other workflows

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check RSS feed for new filings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python rss_monitor.py

      - name: Commit seen markers
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/*.seen 2>/dev/null || true
          git diff --staged --quiet || git commit -m "RSS monitor: mark seen filings"
          git push --force || true

      - name: Report result
        run: cat rss_check_result.txt
