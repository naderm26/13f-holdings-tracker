name: Generate llms.txt

on:
  # Run automatically after stock index is regenerated
  workflow_run:
    workflows: ["Generate Stock Index"]
    types: [completed]

  # Also allow manual trigger
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    # Only run if triggered workflow succeeded (ignored for manual runs)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate llms.txt
        run: python generate_llms_txt.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add llms.txt
          git diff --cached --quiet && echo "No changes to llms.txt" && exit 0
          git commit -m "chore: regenerate llms.txt"
          git push
