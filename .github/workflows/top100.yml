name: Fetch Top 100 Funds

on:
  workflow_dispatch:

jobs:
  top100:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run top 100 script
        run: python fetch_top100.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add top100.json
          git commit -m "Update top 100 funds by AUM" || echo "No changes"
          git push
