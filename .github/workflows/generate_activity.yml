name: Generate Activity Data

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/*.csv'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate activity data
        run: python generate_activity.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add activity.json
          git commit -m "Update activity data" || echo "No changes"
          git push --force
