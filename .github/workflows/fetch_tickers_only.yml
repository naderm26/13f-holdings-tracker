name: Fetch Missing Tickers Only

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch missing tickers
        run: python fetch_tickers.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cusip_to_ticker.json
          git commit -m "Update CUSIP to ticker mappings" || echo "No changes"
          git push --force
